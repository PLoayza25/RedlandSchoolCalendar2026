Pendiente","note":"","resourceLink":""},{"id":"S23-A3","phase":"Investigar y aplicar","minutes":15,"text":"En parejas redactan un párrafo breve sobre acceso desigual al lenguaje escolar, primero para un par, luego para una autoridad; marcan diferencias de registro entre ambas versiones. [D2 · producción con retroalimentación de pares]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S23-A4","phase":"Explicar y conectar","minutes":8,"text":"Comparten un ejemplo por pareja; discuten: ¿el poder del destinatario obliga a cambiar lo que se puede decir, o solo cómo se dice? Conectan con perspectiva y propósito. [D2 · generalización conceptual]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S23-A5","phase":"Demostrar y reflexionar","minutes":5,"text":"Cada estudiante escribe tres oraciones dirigidas a un director escolar defendiendo el derecho a usar su variedad lingüística; señala una marca de registro usada conscientemente. [D2 · evidencia individual]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Dos versiones del mismo mensaje sobre desigualdad lingüística (preparadas por docente), Rúbrica de registro con tres marcas observables, Hoja de trabajo para marcar diferencias entre versiones","Aporte al enunciado de indagación":"El poder del destinatario moldea el registro, limitando o ampliando lo visible.","Retroalimentación":"Docente circula durante fase 3 y señala una marca de registro lograda y una por ajustar en cada par.","Evidencia individual esperada":"Tres oraciones formales al director; se observa consistencia de tono y léxico adecuado al destinatario. [D2]","Conocimiento esencial":"Registro formal e informal como elección condicionada por relaciones de poder."},"note":"","date":""},{"id":24,"week":6,"day":"Jueves","minutes":40,"header":"Sesión 24 · Semana 6 · Jueves · 40 min (1 módulo) [D3] (EE2, EE4, EE6) · Usar gramática, sintaxis y puntuación correctas al escribir sobre poder y perspectiva. · práctica guiada","objective":"Usar gramática, sintaxis y puntuación correctas al escribir sobre poder y perspectiva.","mode":"práctica guiada","codes":"D3","activities":[{"id":"S24-A1","phase":"Conectar y cuestionar","minutes":5,"text":"Leen dos versiones del mismo titular —una con errores gramaticales, otra correcta— y responden: ¿cambia el poder del mensaje cuando hay errores? [D3 · activar conocimiento previo]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S24-A2","phase":"Equipar al estudiante","minutes":7,"text":"Docente modela corrección de tres oraciones con errores de concordancia, subordinación y puntuación usando texto sobre desigualdad mediática; criterios: concordancia, puntura y cohesión. [D3 · modelado explícito]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S24-A3","phase":"Investigar y aplicar","minutes":15,"text":"En parejas, cada estudiante reescribe un párrafo propio con errores señalados, aplica criterios y recibe retroalimentación del compañero contra la lista de criterios. [D3 · práctica con retroalimentación]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S24-A4","phase":"Explicar y conectar","minutes":8,"text":"Comparten una oración corregida; discuten: ¿cómo la corrección gramatical refuerza o debilita la credibilidad de quien habla sobre poder? [D3 · conexión con perspectiva y propósito]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S24-A5","phase":"Demostrar y reflexionar","minutes":5,"text":"Cada estudiante entrega una oración nueva y correcta sobre poder mediático; identifica el error que más le costó corregir. [D3 · evidencia individual]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Dos versiones de titular periodístico sobre acceso a medios, Párrafos propios de sesiones anteriores con errores subrayados, Lista de criterios: concordancia, puntuación, cohesión","Aporte al enunciado de indagación":"La corrección gramatical determina si el mensaje sobre poder se entiende y se cree.","Retroalimentación":"Docente revisa oraciones entregadas en fase 5 para identificar errores persistentes y reagrupar en siguiente sesión.","Evidencia individual esperada":"Una oración correcta sobre poder mediático; se mira concordancia, puntuación y cohesión. [D3]","Conocimiento esencial":"Concordancia, subordinación y puntuación correctas en textos sobre poder mediático."},"note":"","date":""}],"annex":[{"title":"Datos generales","rows":[["Profesor(es)","Test"],["Grupo de asignaturas","Lenguaje"],["Año del PAI","8° Básico"],["Duración de la unidad","30 módulos de 40 min = 24 sesiones (6 de 80 min y 18 de 40 min), en 6 semana(s)"],["Horario semanal de la clase","Lunes: 80 min (módulos 1-2) | Martes: 40 min (módulo 3) | Jueves: 40 min (módulo 4); 40 min (módulo 5)"]]},{"title":"Marco de indagación","rows":[["Indagación: establecimiento del propósito de la unidad"],["Concepto clave","Perspectiva"],["Conceptos relacionados","Punto de vista, Propósito"],["Contexto global","Equidad y desarrollo"],["Exploración","Poder y privilegio"],["Objetivos específicos MYP e indicadores seleccionados","Objetivo A (Analizar):\n- Identificar y explicar el contenido, contexto, lenguaje, estructura, técnica y estilo de los textos y la relación entre ellos\n- Identificar y explicar los efectos de las elecciones del creador en la audiencia\n- Justificar opiniones e ideas utilizando ejemplos, explicaciones y terminología\n- Interpretar semejanzas y diferencias en las características dentro de un mismo texto y entre géneros y textos distintos\nObjetivo B (Organizar):\n- Emplear estructuras organizativas que sirvan al contexto y la intención\n- Organizar opiniones e ideas de manera coherente y lógica\n- Usar herramientas de referencia y formato para crear un estilo de presentación adecuado al contexto y la intención\nObjetivo C (Producir textos):\n- Producir textos que demuestren pensamiento, imaginación y sensibilidad, explorando y considerando nuevas perspectivas e ideas surgidas del compromiso personal con el proceso creativo\n- Seleccionar detalles y ejemplos relevantes para desarrollar ideas\nObjetivo D (Utilizar el lenguaje):\n- Usar vocabulario, estructuras oracionales y formas de expresión variadas y adecuadas\n- Escribir y hablar con un registro y estilo adecuados\n- Usar gramática, sintaxis y puntuación correctas"],["Objetivos de aprendizaje MINEDUC (contenido de apoyo)","[PRIORITARIO] OA 8. Formular una interpretación de los textos literarios leídos o vistos, que sea coherente con su análisis, considerando: Su experiencia personal y sus conocimientos. Un dilema presentado en el texto y su postura personal acerca del mismo. La relación de la obra con la visión de mundo y el contexto histórico en el que se ambienta y/o en el que fue creada.\n[PRIORITARIO] OA 9. Analizar y evaluar textos con finalidad argumentativa como columnas de opinión, cartas y discursos, considerando: La postura del autor y los argumentos e información que la sostienen. La diferencia entre hecho y opinión. Con qué intención el autor usa diversos modos verbales. Su postura personal frente a lo leído y argumentos que la sustentan.\n[PRIORITARIO] OA 10. Analizar y evaluar textos de los medios de comunicación, como noticias, reportajes, cartas al director, textos publicitarios o de las redes sociales, considerando: Los propósitos explícitos e implícitos del texto. Una distinción entre los hechos y las opiniones expresados. Presencia de estereotipos y prejuicios. La suficiencia de información entregada. El análisis e interpretación de imágenes, gráficos, tablas, mapas o diagramas, y su relación con el texto en el que están insertos. Similitudes y diferencias en la forma en que distintas fuentes presentan un mismo hecho.\n[APOYO] OA 18. Construir textos con referencias claras: Usando recursos de correferencia como deícticos —en particular, pronombres personales tónicos y átonos— y nominalización, sustitución pronominal y elipsis, entre otros. Analizando si los recursos de correferencia utilizados evitan o contribuyen a la pérdida del referente, cambios de sentido o problemas de estilo.\n[PRIORITARIO] OA 20. Escribir correctamente para facilitar la comprensión por parte del lector: Aplicando todas las reglas de ortografía literal y acentual. Verificando la escritura de las palabras cuya ortografía no está sujeta a reglas. Usando correctamente punto, coma, raya y dos puntos.\n[APOYO] OA 26. Sintetizar, registrar y ordenar las ideas principales de textos escuchados o leídos para satisfacer propósitos como estudiar, hacer una investigación, recordar detalles, etc."],["Formación Ciudadana (transversal)","FC05 · Fomentar una cultura de la transparencia y la probidad. (Transparencia; Probidad)\nFC06 · Fomentar en los estudiantes la tolerancia y el pluralismo, incorporando prácticas que fomenten la igualdad de género en la convivencia cotidiana y proyectos que fomenten la expresión y el reconocimiento interculturales. (Tolerancia y pluralismo, elementos fundamentales en toda democracia)\nFC07 · Garantizar el desarrollo de una cultura democrática y ética en la escuela, apoyando la organización de elecciones de centro de estudiantes y el desarrollo de actividades de voluntariado y acción social comunitaria. (La democracia en el colegio: ¿de qué manera la vivimos?)"],["Enunciado de la indagación","Quien tiene poder decide qué se dice y cómo se dice, y eso cambia lo que otros pueden ver o entender."],["Preguntas de indagación","Fáctica 1: ¿Qué elementos del texto revelan la perspectiva del autor?\nFáctica 2: ¿Cómo el propósito de un texto influye en las palabras que el autor elige?\nConceptual 1: ¿Puede un texto presentar un punto de vista como si fuera la única verdad posible?\nDebatible 1: ¿Es suficiente identificar la perspectiva de un texto, o hay que demostrar cómo esa perspectiva afecta al lector para realmente analizarlo?"],["Evaluación sumativa","Variante 2: El discurso que no escuchamos\nContexto: Dos discursos sobre el mismo conflicto ambiental provienen de voces con distinto poder institucional.\nProducto: Informe argumentativo escrito que analiza perspectiva, propósito y efecto en dos discursos.\nLee el discurso de una autoridad gubernamental y el de un representante comunitario sobre el mismo conflicto ambiental. Escribe un informe argumentativo en el que: (1) identifiques y expliques el contenido, contexto, lenguaje, estructura y estilo de cada discurso (Criterio A); (2) expliques qué efecto produce cada discurso en su audiencia y por qué (Criterio A); (3) justifiques con ejemplos textuales precisos qué perspectiva tiene más poder para instalar una versión de los hechos como si fuera la única verdad (Criterio A); (4) organices el informe de forma lógica con párrafos bien delimitados y formato adecuado (Criterio B); (5) uses vocabulario variado, registro formal y puntuación correcta (Criterio D). Al final, escribe un párrafo breve en la voz de alguien de la comunidad que no tuvo acceso al micrófono (Criterio C).\nTransferencia a un problema de otra naturaleza: Piensa en las reglas de convivencia de tu colegio: ¿quiénes las redactaron y quiénes no? Explica en 3 oraciones cómo el origen de esas reglas afecta qué perspectivas quedan dentro y cuáles quedan fuera."],["Relación evaluación sumativa / enunciado","Al analizar cómo distintos textos reales presentan una misma realidad, el estudiante puede mostrar que quien controla el lenguaje y la estructura de un texto determina qué se ve y qué queda invisible."],["Correspondencia con banda de logro 7-8 por aspecto","A (A1): Articula con precisión cómo cada elemento textual opera dentro del contexto específico del conflicto ambiental.\nA (A2): Vincula elecciones retóricas concretas del autor a efectos emocionales e ideológicos verificables en la audiencia.\nA (A3): Usa ejemplos textuales precisos y terminología analítica para sostener juicios críticos sobre el poder discursivo.\nA (A4): Establece comparaciones matizadas entre los dos textos identificando patrones, contrastes y tensiones con evidencia específica.\nB (B1 - Emplear estructuras organizativas que sirvan al contexto y la intención): Estructura seleccionada deliberadamente potencia el argumento central y separa con precisión análisis de creación.\nB (B2 - Organizar opiniones e ideas de manera coherente y lógica): Ideas encadenadas con conectores precisos; comparación entre discursos fluye sin rupturas ni redundancias.\nB (B3 - Usar herramientas de referencia y formato para crear un estilo de presentación adecuado al contexto y la intención): Citas, subtítulos y márgenes usados con criterio; formato refuerza la intención argumentativa sin ser decorativo.\nC (C1 - Producir textos que demuestren pensamiento, imaginación y sensibilidad, explorando nuevas perspectivas): Voz construida revela perspectiva auténtica e inesperada; lenguaje evocador muestra compromiso personal con el proceso creativo.\nC (C2 - Seleccionar detalles y ejemplos relevantes para desarrollar ideas): Citas seleccionadas son precisas, pertinentes y articulan el razonamiento sin relleno ni digresión.\nD (D1 - Usar vocabulario, estructuras oracionales y formas de expresión variadas y adecuadas): Variedad léxica y sintáctica es consistente, funcional y enriquece la argumentación sin forzar artificialmente.\nD (D2 - Escribir y hablar con un registro y estilo adecuados): Cambio de registro entre informe y párrafo final es deliberado, coherente y ejecutado con control sostenido.\nD (D3 - Usar gramática, sintaxis y puntuación correctas): Dominio gramatical es consistente en todo el texto; errores ausentes o mínimos sin afectar comunicación."],["Enfoques del aprendizaje (ATL)","Habilidades de pensamiento · Pensamiento crítico: Evaluar si un argumento está respaldado por hechos o solo por opiniones — Enseñanza explícita: Modelado con columnas de opinión reales: distinguir afirmación, evidencia y conclusión — Práctica: Análisis de textos argumentativos en las sesiones de lectura crítica\nHabilidades de comunicación · Comunicación mediante el lenguaje: Adaptar el registro y el tono según el propósito y la audiencia del texto — Enseñanza explícita: Mini-lección con ejemplos contrastados de textos formales e informales sobre el mismo tema — Práctica: Revisión de borradores del texto de producción escrita\nHabilidades de autogestión · Organización: Planificar la estructura de un texto antes de escribirlo usando esquemas simples — Enseñanza explícita: Clase dedicada a construir un esquema guiado con introducción, desarrollo y cierre — Práctica: Elaboración del esquema previo a la redacción del texto final\nHabilidades de investigación · Gestión de la información: Seleccionar citas y ejemplos del texto que apoyen una interpretación específica — Enseñanza explícita: Práctica guiada de selección y descarte de evidencia textual con criterios explícitos — Práctica: Actividad de análisis comparativo de textos en semanas 3 y 4"],["Mentalidad internacional","En japonés, el concepto 'tatemae' (lo que se dice en público) versus 'honne' (lo que se piensa realmente) muestra que la distancia entre perspectiva expresada y perspectiva real es una tensión reconocida y nombrada culturalmente en otras tradiciones."]]},{"title":"Apoyos y contenidos","rows":[["Acción: aprendizaje y enseñanza a través de la indagación"],["Contenidos","OA 8, OA 9, OA 10, OA 18 (apoyo), OA 20, OA 26 (apoyo)"],["Diferenciación (estrategias para bajar barreras)","Apoyo de acceso: Glosario visual con términos clave: hecho, opinión, argumento, estereotipo, propósito explícito/implícito, correferencia, deíctico, nominalización.\nVersión guiada: Plantilla con preguntas paso a paso: ¿Quién habla? ¿Qué dice? ¿Qué no dice? ¿Por qué lo dice así? ¿Qué quiere que yo piense?\nExtensión: Reescribe una noticia cambiando quién la narra; explica cómo cambia lo que el lector puede ver o entender del mismo hecho."]]},{"title":"Arquitectura temporal","rows":[["Arquitectura temporal global"],["Introducción al enunciado (apertura Hora 1)","Dos personas vivieron lo mismo: una salió en el noticiero, la otra no. ¿Por qué crees que pasó eso?"],["Fases de la unidad","Inicial (horas 1-9): Activar conocimientos previos e introducir el concepto\nDesarrollo (horas 10-18): Profundizar y practicar con creciente autonomía\nFinal (horas 19-24): Aplicar y consolidar de cara a la evaluación sumativa"]]},{"title":"Progresión de la unidad","rows":[["Resumen general de la unidad"],["Progresión hacia los objetivos específicos y el enunciado","Los estudiantes parten del reconocimiento de que quien escribe ejerce poder sobre lo visible y lo oculto en el texto, y avanzan progresivamente hacia una comprensión más compleja: que ese poder se manifiesta en elecciones lingüísticas concretas, especialmente en el modo verbal, mediante las cuales el emisor presenta opiniones como verdades indiscutibles. A lo largo de la unidad desarrollan su capacidad analítica para identificar técnicas, contexto e intención autoral; fortalecen la organización coherente de sus interpretaciones; producen textos que articulan postura propia ante dilemas construidos por el poder; y refinan su uso del lenguaje con registro, vocabulario y estructuras adecuadas. Al final, contrastan fuentes editoriales distintas para revelar cómo el propósito del emisor construye una única perspectiva visible."]]},{"title":"Matriz de trazabilidad","rows":[["Matriz de trazabilidad (construida automáticamente a partir del plan generado)"],["Objetivo o desempeño","Sesiones","Evidencia formativa","Evidencia sumativa / alcance"],["Objetivo MYP\nA1 [Criterio A]: Identificar y explicar el contenido, contexto, lenguaje, estructura, técnica y estilo de los textos y la relación entre ellos","1, 5","Se practica en 2 hora(s). Evidencia individual — Sesión 1: Estudiante escribe una elección textual identificada y su efecto; se mira precisión descriptiva vinculada a A1. | Sesión 5: Dos oraciones que explican una elección textual del discurso institucional con evidencia citada. [A1]","(sin correspondencia definida)"],["Objetivo MYP\nA2 [Criterio A]: Identificar y explicar los efectos de las elecciones del creador en la audiencia","2, 6","Se practica en 2 hora(s). Evidencia individual — Sesión 2: Oración que nombra una elección léxica y explica su efecto emocional en el lector; se mira precisión del vínculo causa-efecto. [A2] | Sesión 6: Oración escrita que nombra elección, efecto y audiencia; se mira precisión y vínculo con poder. [A2]","(sin correspondencia definida)"],["Objetivo MYP\nA3 [Criterio A]: Justificar opiniones e ideas utilizando ejemplos, explicaciones y terminología","3","Se practica en 1 hora(s). Evidencia individual — Sesión 3: Justificación escrita individual con término técnico nuevo; se observa estructura afirmación-evidencia-explicación. [A3]","(sin correspondencia definida)"],["Objetivo MYP\nA4 [Criterio A]: Interpretar semejanzas y diferencias en las características dentro de un mismo texto y entre géneros y textos distintos","4","Se practica en 1 hora(s). Evidencia individual — Sesión 4: Dos oraciones individuales: una diferencia entre géneros y una pregunta de transferencia a un tercer texto. Se mira precisión del contraste [A4].","(sin correspondencia definida)"],["Objetivo MYP\nB1 [Criterio B]: Emplear estructuras organizativas que sirvan al contexto y la intención","7, 15","Se practica en 2 hora(s). Evidencia individual — Sesión 7: Oración individual explicando decisión estructural propia y su efecto en el lector; se mira coherencia entre propósito y estructura. [B1] | Sesión 15: Oración individual que justifica la estructura elegida; se observa si vincula organización con propósito del texto. [B1]","(sin correspondencia definida)"],["Objetivo MYP\nB2 [Criterio B]: Organizar opiniones e ideas de manera coherente y lógica","8, 16","Se practica en 2 hora(s). Evidencia individual — Sesión 8: Oración explicativa individual escrita sin ayuda; se mira si conecta tesis y evidencia. [B2] | Sesión 16: Párrafo individual con tesis y argumento ordenado; se mira coherencia y secuencia lógica. [B2]","(sin correspondencia definida)"],["Objetivo MYP\nB3 [Criterio B]: Usar herramientas de referencia y formato para crear un estilo de presentación adecuado al contexto y la intención","9, 18","Se practica en 2 hora(s). Evidencia individual — Sesión 9: Texto de denuncia con tres herramientas aplicadas; se mira coherencia entre formato elegido e intención declarada. [B3] | Sesión 18: Oración explicando cómo formato elegido apoya propósito y audiencia; se observa vínculo intencional formato-propósito. [B3]","(sin correspondencia definida)"],["Objetivo MYP\nC1 [Criterio C]: Producir textos que demuestren pensamiento, imaginación y sensibilidad, explorando y considerando nuevas perspectivas e ideas surgidas del compromiso personal con el proceso creativo","10, 19","Se practica en 2 hora(s). Evidencia individual — Sesión 10: Monólogo de 8-10 líneas desde voz silenciada; se observa si la perspectiva revela limitación de poder. [C1] | Sesión 19: Oración final del estudiante explicando su decisión de escritura; se mira coherencia entre voz y contexto de poder. [C1]","(sin correspondencia definida)"],["Objetivo MYP\nC2 [Criterio C]: Seleccionar detalles y ejemplos relevantes para desarrollar ideas","10, 11, 20","Se practica en 3 hora(s). Evidencia individual — Sesión 11: Oración propia con detalle seleccionado; se observa si el detalle sostiene la idea sin ser vago. [C2] | Sesión 20: Párrafo con dos detalles justificados; se mira especificidad y conexión con idea central. [C2]","(sin correspondencia definida)"],["Objetivo MYP\nD1 [Criterio D]: Usar vocabulario, estructuras oracionales y formas de expresión variadas y adecuadas","12, 22","Se practica en 2 hora(s). Evidencia individual — Sesión 12: Tres oraciones con variación léxico-sintáctica sobre educación desigual; se observa si la elección de vocabulario refleja posición de poder. [D1] | Sesión 22: Oración reescrita con dos recursos distintos; se observa variación estructural y vocabulario preciso. [D1]","(sin correspondencia definida)"],["Objetivo MYP\nD2 [Criterio D]: Escribir y hablar con un registro y estilo adecuados","13, 23","Se practica en 2 hora(s). Evidencia individual — Sesión 13: Párrafo individual con registro ajustado; se observa consistencia de tono y vocabulario según destinatario. [D2] | Sesión 23: Tres oraciones formales al director; se observa consistencia de tono y léxico adecuado al destinatario. [D2]","(sin correspondencia definida)"],["Objetivo MYP\nD3 [Criterio D]: Usar gramática, sintaxis y puntuación correctas","14, 24","Se practica en 2 hora(s). Evidencia individual — Sesión 14: Oración corregida sobre privilegio comunicativo; se mira aplicación correcta de puntuación y sintaxis. [D3] | Sesión 24: Una oración correcta sobre poder mediático; se mira concordancia, puntuación y cohesión. [D3]","(sin correspondencia definida)"],["OA MINEDUC\nOA 8 [prioritario]","1, 2, 3, 4, 5, 6","Se trabaja en 6 hora(s)","Contenido prioritario — la evaluación se centra en los aspectos MYP, no evalúa el OA directamente"],["OA MINEDUC\nOA 9 [prioritario]","1, 2, 3, 4, 5, 6, 10, 12, 19","Se trabaja en 9 hora(s)","Contenido prioritario — la evaluación se centra en los aspectos MYP, no evalúa el OA directamente"],["OA MINEDUC\nOA 10 [prioritario]","—","Sin cobertura: ninguna hora lo trabaja","Contenido prioritario — la evaluación se centra en los aspectos MYP, no evalúa el OA directamente"],["OA MINEDUC\nOA 18 [apoyo]","—","Sin cobertura: ninguna hora lo trabaja","Contenido de apoyo — no es foco de la evaluación sumativa"],["OA MINEDUC\nOA 20 [prioritario]","7, 8, 9, 10, 11, 12, 13, 15, 16, 18, 19, 20, 22, 23, 24","Se trabaja en 15 hora(s)","Contenido prioritario — la evaluación se centra en los aspectos MYP, no evalúa el OA directamente"],["OA MINEDUC\nOA 26 [apoyo]","9, 13, 14","Se trabaja en 3 hora(s)","Contenido de apoyo — no es foco de la evaluación sumativa"],["Formación Ciudadana\nFomentar una cultura de la transparencia y la probidad.","—","Sin cobertura verificable: ninguna hora registra una acción real sobre este objetivo","Transversal — no es objeto de evaluación"],["Formación Ciudadana\nFomentar en los estudiantes la tolerancia y el pluralismo, incorporando prácticas que fomenten la igualdad de género en la convivencia cotidiana y proyectos que fomenten la expresión y el reconocimiento interculturales.","2, 3, 4, 5, 7, 8, 9, 10, 11, 12, 13, 15, 16, 18, 19, 20, 23","Acción observable en 17 hora(s)","Transversal — no es objeto de evaluación"],["Formación Ciudadana\nGarantizar el desarrollo de una cultura democrática y ética en la escuela, apoyando la organización de elecciones de centro de estudiantes y el desarrollo de actividades de voluntariado y acción social comunitaria.","—","Sin cobertura verificable: ninguna hora registra una acción real sobre este objetivo","Transversal — no es objeto de evaluación"]]}]}</script><script>
'use strict';
const initial=JSON.parse(document.getElementById('seed').textContent);let state=structuredClone(initial),view='map',selected=initial.sessions[0].id,search='';const slug=String(initial.title||'unidad').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'')||'unidad';const KEY='redland-unit-v1-'+slug;const NS=initial.sessions.length,FIRST=initial.sessions[0].id,LAST=initial.sessions[NS-1].id;const isSum=s=>s.summative===true||(s.summative!==false&&/evaluaci[oó]n sumativa/i.test(s.objective+' '+s.mode));const listY=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' y '+a[a.length-1];const weeks=()=>Math.max(...state.sessions.map(s=>+s.week||0));const C=k=>(state.curriculum||{})[k]||'';let storageOK=true,saveTimer;
try{let old=localStorage.getItem(KEY);if(old){let v=JSON.parse(old);if(valid(v)&&(!initial.savedAt||(v.savedAt||0)>initial.savedAt))state=v}}catch(e){storageOK=false}
function valid(v){return v&&v.version===1&&Array.isArray(v.sessions)&&v.sessions.length===NS&&v.sessions.every(s=>Number.isInteger(s.id)&&Array.isArray(s.activities)&&s.activities.every(a=>typeof a.id==='string'&&typeof a.text==='string'&&Number.isFinite(a.minutes)&&Array.isArray(a.details)))}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',4000)}
function persist(){state.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false}document.getElementById('saved').textContent=storageOK?'Cambios guardados en este navegador':'Guarde una copia para conservar los cambios';}
function download(name,body,type){let u=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function session(){return state.sessions.find(s=>s.id===selected)}function act(id){for(let s of state.sessions){let a=s.activities.find(a=>a.id===id);if(a)return [s,a]}return []}
function ed(text,path,tag='div'){return `<${tag} class="editable" ${view==='class'?'':'contenteditable="true" spellcheck="true"'} data-path="${esc(path)}">${esc(text)}</${tag}>`}
function get(path){return path.split('.').reduce((a,k)=>a[k],state)}function put(path,val){let p=path.split('.'),k=p.pop(),o=p.reduce((a,k)=>a[k],state);o[k]=val;persist()}
function sidx(){return state.sessions.findIndex(s=>s.id===selected)}
function details(a,si,ai){return a.details.length?`<details><summary>Recursos y orientaciones de esta actividad (${a.details.length})</summary>${a.details.map((d,i)=>`<div class="detail">${ed(d,`sessions.${si}.activities.${ai}.details.${i}`)}</div>`).join('')}</details>`:''}
function render(){document.body.classList.toggle('classmode',view==='class');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let m=document.getElementById('main');
if(view==='map'){
let count=state.sessions.reduce((n,s)=>n+s.activities.filter(a=>a.status==='Realizada').length,0),total=state.sessions.reduce((n,s)=>n+s.activities.length,0);
m.innerHTML=`<section class="panel"><span class="eyebrow">LA UNIDAD EN UNA MIRADA</span><h2>${esc(state.headline||state.title)}</h2>${ed(state.curriculum['Enunciado de la indagación'],'curriculum.Enunciado de la indagación')}<p>${[C('Concepto clave')&&'<strong>'+esc(C('Concepto clave'))+'</strong>',esc(listY(C('Conceptos relacionados').split(/\s*,\s*/).filter(Boolean))),esc(C('Contexto global')),esc(C('Exploración'))].filter(Boolean).join(' · ')}</p><details><summary>Preguntas de indagación y desafío final</summary><h3>Preguntas</h3><div class="editable">${esc(state.curriculum['Preguntas de indagación'])}</div><h3>Evaluación sumativa</h3><div class="editable">${esc(state.curriculum['Evaluación sumativa'])}</div></details><p>${count} de ${total} actividades realizadas · ${state.sessions.reduce((n,s)=>n+s.activities.reduce((x,a)=>x+a.minutes,0),0)} minutos planificados</p><p class="notice">${(()=>{let ids=state.sessions.filter(isSum).map(s=>s.id);return ids.length?(ids.length>1?`Las sesiones ${listY(ids)} están reservadas`:`La sesión ${ids[0]} está reservada`)+' para la evaluación sumativa. ':''})()}Los identificadores de actividad conservan la sesión de origen si se trasladan.</p></section><div class="row between"><h2>Recorrido de las clases</h2><input id="search" type="search" placeholder="Buscar sesión, criterio o actividad" aria-label="Buscar sesiones" value="${esc(search)}"></div><div class="grid" id="cards"></div>`;cards();
}else if(view==='lesson'||view==='class'){
const s=session(),si=sidx(),sum=s.activities.reduce((n,a)=>n+a.minutes,0);m.innerHTML=`<div class="row between"><div class="row"><button id="prev" ${selected===FIRST?'disabled':''}>←</button><select id="selectsession" aria-label="Elegir sesión">${state.sessions.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>Sesión ${x.id} · Semana ${x.week}</option>`).join('')}</select><button id="next" ${selected===LAST?'disabled':''}>→</button></div><span class="chip">${sum} min actuales / ${s.minutes} min originales</span></div><section class="panel"><span class="eyebrow">SESIÓN ${s.id} · SEMANA ${s.week} · ${esc(s.day)}</span><h2>Aprendizaje de la clase</h2>${ed(s.objective,`sessions.${si}.objective`)}<p class="muted">Aspectos ${esc(s.codes)} · ${esc(s.mode)}</p><label class="editonly">Fecha de implementación <input type="date" data-path="sessions.${si}.date" value="${esc(s.date)}"></label><details class="editonly"><summary>Antes de la clase y qué observar</summary><h3>Materiales sugeridos</h3>${ed(s.extras['Materiales sugeridos']||'',`sessions.${si}.extras.Materiales sugeridos`)}<p class="notice">Son indicaciones de preparación. Un recurso solo está disponible al incorporarlo o enlazarlo en la actividad.</p><h3>Evidencia individual esperada</h3>${ed(s.extras['Evidencia individual esperada']||'Aplicación de la evaluación sumativa descrita en el marco curricular.',`sessions.${si}.extras.Evidencia individual esperada`)}<h3>Apoyos de acceso y extensión</h3><div class="editable">${esc((state.supports||{})['Diferenciación (estrategias para bajar barreras)']||'')}</div></details></section>${s.activities.map((a,ai)=>`<article class="activity ${a.status==='Realizada'?'done':''}"><div class="acthead"><span class="chip">${esc(a.id)}</span><h3>${esc(a.phase)}</h3><span>${a.minutes} min</span></div>${ed(a.text,`sessions.${si}.activities.${ai}.text`)}${details(a,si,ai)}${a.resourceLink?`<p><a href="${esc(safeURL(a.resourceLink))}" target="_blank" rel="noopener">Abrir recurso de la actividad ↗</a></p>`:''}<div class="controls"><label>Estado <select data-status="${a.id}">${['Pendiente','Realizada','Por retomar'].map(x=>`<option ${x===a.status?'selected':''}>${x}</option>`).join('')}</select></label><label class="editonly">Tiempo <input type="number" class="time" min="1" max="240" data-minutes="${a.id}" value="${a.minutes}"></label><button class="editonly" data-up="${a.id}" ${ai===0?'disabled':''} aria-label="Subir actividad">↑</button><button class="editonly" data-down="${a.id}" ${ai===s.activities.length-1?'disabled':''} aria-label="Bajar actividad">↓</button><select class="editonly" data-move="${a.id}" aria-label="Trasladar actividad"><option value="">Mover a otra sesión…</option>${state.sessions.filter(x=>x.id!==selected).map(x=>`<option value="${x.id}">Sesión ${x.id}</option>`).join('')}</select></div><details class="editonly"><summary>Mis ajustes y enlace al recurso</summary><label>Enlace al recurso<input class="linkfield" data-link="${a.id}" value="${esc(a.resourceLink)}" placeholder="https://…"></label><label>Notas o adaptación<textarea class="note" data-path="sessions.${si}.activities.${ai}.note">${esc(a.note)}</textarea></label></details></article>`).join('')}<section class="panel editonly"><h2>Después de implementar</h2><label>Hasta dónde llegamos, evidencia observada y decisiones para la próxima clase<textarea class="note" data-path="sessions.${si}.note">${esc(s.note)}</textarea></label><details><summary>Conexión conceptual y retroalimentación</summary>${Object.entries(s.extras).filter(([k])=>k!=='Materiales sugeridos'&&k!=='Evidencia individual esperada').map(([k,v])=>`<h3>${esc(k)}</h3>${ed(v,`sessions.${si}.extras.${k}`)}`).join('')}<h3>Referencia original</h3><p>${esc(s.header)}</p></details></section>`;
}else if(view==='resources'){m.innerHTML=`<section class="panel"><h2>Preparación de recursos</h2><p>Consulte los materiales sugeridos de cada sesión. Los modelos, consignas y respuestas ya incluidos permanecen junto a su actividad. Añada el enlace al material preparado en cada actividad.</p></section>${state.sessions.map(s=>`<section class="panel"><div class="row between"><h3>Sesión ${s.id}</h3><button data-open="${s.id}">Preparar sesión</button></div><p>${esc(s.extras['Materiales sugeridos']||'')}</p>${s.activities.filter(a=>a.resourceLink).map(a=>`<p>${esc(a.id)} · <a href="${esc(safeURL(a.resourceLink))}" target="_blank" rel="noopener">Abrir recurso</a></p>`).join('')}</section>`).join('')}`;
}else if(view==='reference'){m.innerHTML=`<section class="panel"><h2>Marco curricular y seguimiento</h2><p>Referencia completa del documento original. La matriz original no se recalcula cuando se mueven o modifican actividades. Revise las correspondencias antes de cerrar la unidad.</p>${state.referenceNotice?`<p class="notice">${esc(state.referenceNotice)}</p>`:''}</section>${(state.annex||[]).map(ar=>`<section class="panel"><details><summary>${esc(ar.title)}</summary>${ar.rows.map(row=>row.length===1?`<h3>${esc(row[0])}</h3>`:`<div class="detail"><strong>${esc(row[0])}</strong>${row.slice(1).map(v=>`<div class="editable">${esc(v)}</div>`).join('')}</div>`).join('')}</details></section>`).join('')}`;
}else{m.innerHTML=`<section class="panel"><span class="eyebrow">GUÍA DE USO</span><h2>Un archivo para preparar y acompañar las clases</h2><ol><li><strong>Descargue este HTML y ábralo en Chrome, Edge o Firefox.</strong> Funciona sin conexión.</li><li>En <strong>Mapa de la unidad</strong>, elija una de las ${NS} sesiones o busque una actividad.</li><li>En <strong>Preparar sesión</strong>, pulse sobre el texto para editarlo. Abra las orientaciones, agregue enlaces y ajuste tiempos.</li><li>Suba o baje una actividad con las flechas, o muévala a otra sesión con el selector. Se conserva el identificador de origen y se actualiza la suma de minutos.</li><li>En <strong>Usar en clase</strong>, consulte la secuencia con letra mayor y marque lo realizado o lo que debe retomar. Esta vista está pensada para el docente; las orientaciones pueden incluir respuestas.</li><li>Al terminar, vuelva a <strong>Preparar sesión</strong> y registre avances y decisiones.</li><li>Pulse <strong>Guardar copia con cambios</strong> para descargar un nuevo HTML que contiene el trabajo actualizado. Ese archivo puede abrirse en otro equipo.</li><li><strong>Exportar respaldo</strong> guarda los datos en JSON. <strong>Importar respaldo</strong> reemplaza los datos abiertos; guarde antes su versión si quiere conservarla.</li></ol><p>El guardado automático depende de este navegador. Para conservar o compartir su trabajo, descargue una copia con cambios. Las copias son independientes y no se sincronizan.</p><h3>Qué contiene</h3><p>Las ${NS} sesiones originales, ${state.sessions.reduce((n,s)=>n+s.activities.length,0)} actividades independientes y el marco curricular completo.${(()=>{let ids=state.sessions.filter(isSum).map(s=>s.id);return ids.length?` ${ids.length>1?'Las sesiones '+listY(ids)+' mantienen':'La sesión '+ids[0]+' mantiene'} su bloque de evaluación sumativa.`:''})()} Los materiales sugeridos siguen requiriendo preparación cuando el original no los incorpora.</p><h3>Imprimir</h3><p>Seleccione un function safeURL(v){try{let u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch(e){return '#'}}

document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();window.scrollTo(0,0)}if(b.dataset.open){selected=+b.dataset.open;view='lesson';render();window.scrollTo(0,0)}if(b.id==='prev'||b.id==='next'){let i=sidx()+(b.id==='prev'?-1:1);if(i>=0&&i<NS)selected=state.sessions[i].id;render();window.scrollTo(0,0)}if(b.dataset.up||b.dataset.down){let [s,a]=act(b.dataset.up||b.dataset.down),i=s.activities.indexOf(a),j=i+(b.dataset.up?-1:1);if(j>=0&&j<s.activities.length){[s.activities[i],s.activities[j]]=[s.activities[j],s.activities[i]];persist();render()}}});
document.addEventListener('input',e=>{let x=e.target;if(x.id==='search'){search=x.value;cards();return}if(x.dataset.path){put(x.dataset.path,x.isContentEditable?x.innerText:x.value)}});
document.addEventListener('change',e=>{let x=e.target;if(x.id==='selectsession'){selected=+x.value;render()}if(x.dataset.status){act(x.dataset.status)[1].status=x.value;persist();render()}if(x.dataset.minutes){let v=Number(x.value);if(Number.isFinite(v)&&v>=1&&v<=240){act(x.dataset.minutes)[1].minutes=v;persist()}render()}if(x.dataset.link){if(x.value&&!safeURL(x.value).startsWith('http')){toast('Use un enlace completo que comience por https://');return}act(x.dataset.link)[1].resourceLink=x.value;persist();render()}if(x.dataset.move&&x.value){let [s,a]=act(x.dataset.move),target=state.sessions.find(s=>s.id===+x.value);s.activities.splice(s.activities.indexOf(a),1);target.activities.push(a);persist();render();toast(a.id+' trasladada a la sesión '+target.id)}});
document.getElementById('export').onclick=()=>{persist();download('Respaldo_'+slug+'.json',JSON.stringify(state,null,2),'application/json')};
document.getElementById('savecopy').onclick=()=>{persist();let old=document.getElementById('seed').textContent;document.getElementById('seed').textContent=JSON.stringify(state).replace(/</g,'\\u003c');let doc='<!DOCTYPE html>\n'+document.documentElement.outerHTML;document.getElementById('seed').textContent=old;download('Planificador_'+slug+'_actualizado.html',doc,'text/html;charset=utf-8');toast('Copia con los cambios descargada')};
document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!valid(v))throw Error();if(!confirm('Se reemplazarán los datos abiertos por este respaldo. ¿Continuar?'))return;state=v;persist();render();toast('Respaldo importado')}catch(er){toast('El archivo no es un respaldo válido de esta unidad')}e.target.value=''};
document.getElementById('print').onclick=()=>window.print();document.getElementById('utitle').textContent=state.title;document.getElementById('usub').textContent=state.subtitle||[state.meta&&state.meta['Grupo de asignaturas'],state.meta&&state.meta['Año del PAI'],NS+' sesiones',weeks()+' semana'+(weeks()===1?'':'s')].filter(Boolean).join(' · ');document.title='Redland School · '+state.title;render();document.getElementById('saved').textContent=storageOK?'Guardado local disponible · descargue una copia para compartir':'Guarde una copia para conservar cambios';
</script></body></html>
