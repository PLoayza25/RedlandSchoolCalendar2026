</style></head><body><header><div class="brand">REDLAND SCHOOL · MYP</div><h1 id="utitle"></h1><div class="sub" id="usub"></div><div class="toolbar"><button class="primary" id="savecopy">Guardar copia con cambios</button><button id="export">Exportar respaldo</button><button id="import">Importar respaldo</button><button id="print">Imprimir vista</button><span class="statusmsg" id="saved"></span></div></header><nav id="nav"><button data-view="map">Mapa de la unidad</button><button data-view="lesson">Preparar sesión</button><button data-view="class">Usar en clase</button><button data-view="resources">Recursos</button><button data-view="reference">Marco curricular</button><button data-view="help">Cómo usar</button></nav><main id="main"></main><footer>Archivo de trabajo local · Los cambios no se sincronizan con otras personas. Guarde una copia para conservarlos y compartirlos.</footer><div id="toast" role="status"></div><input type="file" id="file" accept="application/json,.json" hidden><script id="seed" type="application/json">{"version":1,"title":"Poder perspectiva y lenguaje","headline":"Quién tiene poder decide qué se dice y cómo","subtitle":"Lengua y Literatura · 8.º básico · 24 sesiones · 6 semanas","referenceNotice":"El documento original declara pendientes de cobertura en algunos OA y objetivos de Formación Ciudadana. Se mantienen para revisión.","meta":{"Profesor(es)":"Test","Grupo de asignaturas":"Lenguaje","Año del PAI":"8° Básico","Duración de la unidad":"30 módulos de 40 min = 24 sesiones (6 de 80 min y 18 de 40 min), en 6 semana(s)","Horario semanal de la clase":"Lunes: 80 min (módulos 1-2) | Martes: 40 min (módulo 3) | Jueves: 40 min (módulo 4); 40 min (módulo 5)"},"curriculum":{"Concepto clave":"Perspectiva","Conceptos relacionados":"Punto de vista, Propósito","Contexto global":"Equidad y desarrollo","Exploración":"Poder y privilegio","Objetivos específicos MYP e indicadores seleccionados":"Objetivo A (Analizar):\n- Identificar y explicar el contenido, contexto, lenguaje, estructura, técnica y estilo de los textos y la relación entre ellos\n- Identificar y explicar los efectos de las elecciones del creador en la audiencia\n- Justificar opiniones e ideas utilizando ejemplos, explicaciones y terminología\n- Interpretar semejanzas y diferencias en las características dentro de un mismo texto y entre géneros y textos distintos\nObjetivo B (Organizar):\n- Emplear estructuras organizativas que sirvan al contexto y la intención\n- Organizar opiniones e ideas de manera coherente y lógica\n- Usar herramientas de referencia y formato para crear un estilo de presentación adecuado al contexto y la intención\nObjetivo C (Producir textos):\n- Producir textos que demuestren pensamiento, imaginación y sensibilidad, explorando y considerando nuevas perspectivas e ideas surgidas del compromiso personal con el proceso creativo\n- Seleccionar detalles y ejemplos relevantes para desarrollar ideas\nObjetivo D (Utilizar el lenguaje):\n- Usar vocabulario, estructuras oracionales y formas de expresión variadas y adecuadas\n- Escribir y hablar con un registro y estilo adecuados\n- Usar gramática, sintaxis y puntuación correctas","Objetivos de aprendizaje MINEDUC (contenido de apoyo)":"[PRIORITARIO] OA 8. Formular una interpretación de los textos literarios leídos o vistos, que sea coherente con su análisis, considerando: Su experiencia personal y sus conocimientos. Un dilema presentado en el texto y su postura personal acerca del mismo. La relación de la obra con la visión de mundo y el contexto histórico en el que se ambienta y/o en el que fue creada.\n[PRIORITARIO] OA 9. Analizar y evaluar textos con finalidad argumentativa como columnas de opinión, cartas y discursos, considerando: La postura del autor y los argumentos e información que la sostienen. La diferencia entre hecho y opinión. Con qué intención el autor usa diversos modos verbales. Su postura personal frente a lo leído y argumentos que la sustentan.\n[PRIORITARIO] OA 10. Analizar y evaluar textos de los medios de comunicación, como noticias, reportajes, cartas al director, textos publicitarios o de las redes sociales, considerando: Los propósitos explícitos e implícitos del texto. Una distinción entre los hechos y las opiniones expresados. Presencia de estereotipos y prejuicios. La suficiencia de información entregada. El análisis e interpretación de imágenes, gráficos, tablas, mapas o diagramas, y su relación con el texto en el que están insertos. Similitudes y diferencias en la forma en que distintas fuentes presentan un mismo hecho.\n[APOYO] OA 18. Construir textos con referencias claras: Usando recursos de correferencia como deícticos —en particular, pronombres personales tónicos y átonos— y nominalización, sustitución pronominal y elipsis, entre otros. Analizando si los recursos de correferencia utilizados evitan o contribuyen a la pérdida del referente, cambios de sentido o problemas de estilo.\n[PRIORITARIO] OA 20. Escribir correctamente para facilitar la comprensión por parte del lector: Aplicando todas las reglas de ortografía literal y acentual. Verificando la escritura de las palabras cuya ortografía no está sujeta a reglas. Usando correctamente punto, coma, raya y dos puntos.\n[APOYO] OA 26. Sintetizar, registrar y ordenar las ideas principales de textos escuchados o leídos para satisfacer propósitos como estudiar, hacer una investigación, recordar detalles, etc.","Formación Ciudadana (transversal)":"FC05 · Fomentar una cultura de la transparencia y la probidad. (Transparencia; Probidad)\nFC06 · Fomentar en los estudiantes la tolerancia y el pluralismo, incorporando prácticas que fomenten la igualdad de género en la convivencia cotidiana y proyectos que fomenten la expresión y el reconocimiento interculturales. (Tolerancia y pluralismo, elementos fundamentales en toda democracia)\nFC07 · Garantizar el desarrollo de una cultura democrática y ética en la escuela, apoyando la organización de elecciones de centro de estudiantes y el desarrollo de actividades de voluntariado y acción social comunitaria. (La democracia en el colegio: ¿de qué manera la vivimos?)","Enunciado de la indagación":"Quien tiene poder decide qué se dice y cómo se dice, y eso cambia lo que otros pueden ver o entender.","Preguntas de indagación":"Fáctica 1: ¿Qué elementos del texto revelan la perspectiva del autor?\nFáctica 2: ¿Cómo el propósito de un texto influye en las palabras que el autor elige?\nConceptual 1: ¿Puede un texto presentar un punto de vista como si fuera la única verdad posible?\nDebatible 1: ¿Es suficiente identificar la perspectiva de un texto, o hay que demostrar cómo esa perspectiva afecta al lector para realmente analizarlo?","Evaluación sumativa":"Variante 2: El discurso que no escuchamos\nContexto: Dos discursos sobre el mismo conflicto ambiental provienen de voces con distinto poder institucional.\nProducto: Informe argumentativo escrito que analiza perspectiva, propósito y efecto en dos discursos.\nLee el discurso de una autoridad gubernamental y el de un representante comunitario sobre el mismo conflicto ambiental. Escribe un informe argumentativo en el que: (1) identifiques y expliques el contenido, contexto, lenguaje, estructura y estilo de cada discurso (Criterio A); (2) expliques qué efecto produce cada discurso en su audiencia y por qué (Criterio A); (3) justifiques con ejemplos textuales precisos qué perspectiva tiene más poder para instalar una versión de los hechos como si fuera la única verdad (Criterio A); (4) organices el informe de forma lógica con párrafos bien delimitados y formato adecuado (Criterio B); (5) uses vocabulario variado, registro formal y puntuación correcta (Criterio D). Al final, escribe un párrafo breve en la voz de alguien de la comunidad que no tuvo acceso al micrófono (Criterio C).\nTransferencia a un problema de otra naturaleza: Piensa en las reglas de convivencia de tu colegio: ¿quiénes las redactaron y quiénes no? Explica en 3 oraciones cómo el origen de esas reglas afecta qué perspectivas quedan dentro y cuáles quedan fuera.","Relación evaluación sumativa / enunciado":"Al analizar cómo distintos textos reales presentan una misma realidad, el estudiante puede mostrar que quien controla el lenguaje y la estructura de un texto determina qué se ve y qué queda invisible.","Correspondencia con banda de logro 7-8 por aspecto":"A (A1): Articula con precisión cómo cada elemento textual opera dentro del contexto específico del conflicto ambiental.\nA (A2): Vincula elecciones retóricas concretas del autor a efectos emocionales e ideológicos verificables en la audiencia.\nA (A3): Usa ejemplos textuales precisos y terminología analítica para sostener juicios críticos sobre el poder discursivo.\nA (A4): Establece comparaciones matizadas entre los dos textos identificando patrones, contrastes y tensiones con evidencia específica.\nB (B1 - Emplear estructuras organizativas que sirvan al contexto y la intención): Estructura seleccionada deliberadamente potencia el argumento central y separa con precisión análisis de creación.\nB (B2 - Organizar opiniones e ideas de manera coherente y lógica): Ideas encadenadas con conectores precisos; comparación entre discursos fluye sin rupturas ni redundancias.\nB (B3 - Usar herramientas de referencia y formato para crear un estilo de presentación adecuado al contexto y la intención): Citas, subtítulos y márgenes usados con criterio; formato refuerza la intención argumentativa sin ser decorativo.\nC (C1 - Producir textos que demuestren pensamiento, imaginación y sensibilidad, explorando nuevas perspectivas): Voz construida revela perspectiva auténtica e inesperada; lenguaje evocador muestra compromiso personal con el proceso creativo.\nC (C2 - Seleccionar detalles y ejemplos relevantes para desarrollar ideas): Citas seleccionadas son precisas, pertinentes y articulan el razonamiento sin relleno ni digresión.\nD (D1 - Usar vocabulario, estructuras oracionales y formas de expresión variadas y adecuadas): Variedad léxica y sintáctica es consistente, funcional y enriquece la argumentación sin forzar artificialmente.\nD (D2 - Escribir y hablar con un registro y estilo adecuados): Cambio de registro entre informe y párrafo final es deliberado, coherente y ejecutado con control sostenido.\nD (D3 - Usar gramática, sintaxis y puntuación correctas): Dominio gramatical es consistente en todo el texto; errores ausentes o mínimos sin afectar comunicación.","Enfoques del aprendizaje (ATL)":"Habilidades de pensamiento · Pensamiento crítico: Evaluar si un argumento está respaldado por hechos o solo por opiniones — Enseñanza explícita: Modelado con columnas de opinión reales: distinguir afirmación, evidencia y conclusión — Práctica: Análisis de textos argumentativos en las sesiones de lectura crítica\nHabilidades de comunicación · Comunicación mediante el lenguaje: Adaptar el registro y el tono según el propósito y la audiencia del texto — Enseñanza explícita: Mini-lección con ejemplos contrastados de textos formales e informales sobre el mismo tema — Práctica: Revisión de borradores del texto de producción escrita\nHabilidades de autogestión · Organización: Planificar la estructura de un texto antes de escribirlo usando esquemas simples — Enseñanza explícita: Clase dedicada a construir un esquema guiado con introducción, desarrollo y cierre — Práctica: Elaboración del esquema previo a la redacción del texto final\nHabilidades de investigación · Gestión de la información: Seleccionar citas y ejemplos del texto que apoyen una interpretación específica — Enseñanza explícita: Práctica guiada de selección y descarte de evidencia textual con criterios explícitos — Práctica: Actividad de análisis comparativo de textos en semanas 3 y 4","Mentalidad internacional":"En japonés, el concepto 'tatemae' (lo que se dice en público) versus 'honne' (lo que se piensa realmente) muestra que la distancia entre perspectiva expresada y perspectiva real es una tensión reconocida y nombrada culturalmente en otras tradiciones."},"supports":{"Contenidos":"OA 8, OA 9, OA 10, OA 18 (apoyo), OA 20, OA 26 (apoyo)","Diferenciación (estrategias para bajar barreras)":"Apoyo de acceso: Glosario visual con términos clave: hecho, opinión, argumento, estereotipo, propósito explícito/implícito, correferencia, deíctico, nominalización.\nVersión guiada: Plantilla con preguntas paso a paso: ¿Quién habla? ¿Qué dice? ¿Qué no dice? ¿Por qué lo dice así? ¿Qué quiere que yo piense?\nExtensión: Reescribe una noticia cambiando quién la narra; explica cómo cambia lo que el lector puede ver o entender del mismo hecho."},"architecture":{"Introducción al enunciado (apertura Hora 1)":"Dos personas vivieron lo mismo: una salió en el noticiero, la otra no. ¿Por qué crees que pasó eso?","Fases de la unidad":"Inicial (horas 1-9): Activar conocimientos previos e introducir el concepto\nDesarrollo (horas 10-18): Profundizar y practicar con creciente autonomía\nFinal (horas 19-24): Aplicar y consolidar de cara a la evaluación sumativa"},"sessions":[{"id":1,"week":1,"day":"Lunes","minutes":80,"header":"Sesión 1 · Semana 1 · Lunes · 80 min (2 módulos) [A1] (EE1, EE2, EE3, EE4, EE6) · Explorar cómo el poder sobre el lenguaje condiciona lo que se muestra u oculta en textos reales. · modelado","objective":"Explorar cómo el poder sobre el lenguaje condiciona lo que se muestra u oculta en textos reales.","mode":"modelado","codes":"A1","activities":[{"id":"S01-A1","phase":"Conectar y cuestionar","minutes":10,"text":"Proyecta dos titulares sobre el mismo hecho desde medios con líneas editoriales opuestas. ¿Qué decide cada titular mostrar y qué deja fuera? [A1 · sondeo exploratorio sobre poder y lenguaje]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S01-A2","phase":"Equipar al estudiante","minutes":14,"text":"Docente modela cómo identificar contenido, contexto y estructura en un titular: qué dice, quién lo publica y para qué audiencia. Criterios: (1) nombro qué información incluye, (2) identifico el contexto de publicación, (3) describo una elección estructural visible. Verificación rápida: cada estudiante escribe en un papel qué información falta en su titular favorito. [A1 · modelado de análisis textual]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S01-A3","phase":"Investigar y aplicar","minutes":30,"text":"En parejas analizan un afiche oficial de campaña gubernamental y una caricatura crítica del mismo tema: identifican contenido, contexto y una elección estructural en cada texto, anotando qué muestra y qué omite cada uno. Docente circula y retroalimenta contra los tres criterios. [A1 · análisis comparativo con evidencia textual]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S01-A4","phase":"Explicar y conectar","minutes":16,"text":"Comparten hallazgos: ¿qué patrón emerge sobre quién controla lo que se ve? Prueban la generalización provisional: 'El poder decide qué información entra y qué queda fuera del texto.' [A1 · conexión con concepto de perspectiva]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S01-A5","phase":"Demostrar y reflexionar","minutes":10,"text":"Cada estudiante escribe dos oraciones: una elección textual que encontró y qué efecto produce en el lector. Anota una pregunta pendiente sobre poder y lenguaje. [A1 · evidencia individual escrita]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Dos titulares impresos o proyectados sobre el mismo hecho, Afiche gubernamental y caricatura editorial del mismo tema, Pauta de tres criterios de logro visible en pizarra","Aporte al enunciado de indagación":"El poder editorial decide qué información entra al texto y qué perspectiva construye.","Retroalimentación":"Docente revisa papeles de verificación rápida y ajusta el modelado si los estudiantes confunden contexto con contenido.","Evidencia individual esperada":"Estudiante escribe una elección textual identificada y su efecto; se mira precisión descriptiva vinculada a A1.","Conocimiento esencial":"Contenido, contexto y estructura textual como elecciones que revelan perspectiva y poder."},"note":"","date":""},{"id":2,"week":1,"day":"Martes","minutes":40,"header":"Sesión 2 · Semana 1 · Martes · 40 min (1 módulo) [A2] (EE1, EE2, EE3, EE6) {FC06} · Identificar y explicar cómo las elecciones del creador de un texto construyen un efecto específico sobre la audiencia en contextos de poder y privilegio. · modelado","objective":"Identificar y explicar cómo las elecciones del creador de un texto construyen un efecto específico sobre la audiencia en contextos de poder y privilegio.","mode":"modelado","codes":"A2","activities":[{"id":"S02-A1","phase":"Conectar y cuestionar","minutes":5,"text":"Observan dos titulares sobre la misma huelga: uno de medio corporativo, otro sindical. Responden: ¿qué siente cada lector? [A2 · activar intuición sobre efecto]","details":["Recurso (lo presenta el docente): Dos titulares proyectados sobre misma huelga — Titular A (medio corporativo): 'Trabajadores paralizan ciudad y generan caos en el transporte'. Titular B (medio sindical): 'Trabajadores defienden sus derechos y exigen condiciones dignas'. ¿Qué siente un lector de cada titular? ¿Por qué?","Respuesta esperada: Estudiantes reconocen intuitivamente que cada titular genera una emoción distinta; identifican al menos una palabra responsable de ese efecto sin necesitar terminología técnica aún."],"status":"Pendiente","note":"","resourceLink":""},{"id":"S02-A2","phase":"Equipar al estudiante","minutes":7,"text":"Se aclara: 'Hoy identificarás elecciones del creador y explicarás su efecto en el lector.' Docente modela con un titular: señala adjetivo, verbo y tono; nombra efecto concreto. [A2 · modelado de análisis]","details":["Recurso (lo presenta el docente): Titular modelo proyectado con análisis paso a paso — Titular modelo: 'Manifestantes bloquean el centro y atemorizan a comerciantes'. Paso 1: subraya el adjetivo o verbo más cargado. Paso 2: nómbralo. Paso 3: di qué emoción produce en el lector y por qué. Criterios: (1) nombra la elección, (2) vincula a un efecto emocional, (3) explica el por qué.","Respuesta esperada: Estudiantes observan que el docente nombra la elección léxica, describe el efecto emocional concreto y justifica el vínculo; retienen los tres criterios de logro."],"status":"Pendiente","note":"","resourceLink":""},{"id":"S02-A3","phase":"Investigar y aplicar","minutes":15,"text":"En parejas, analizan fragmento de nota informativa sobre protesta estudiantil: subrayan dos elecciones léxicas y escriben qué efecto produce cada una en el lector. Docente retroalimenta contra criterio. [A2 · práctica con evidencia]","details":["Recurso (los estudiantes lo revisan): Fragmento impreso de nota informativa sobre protesta","Orientación (el docente busca o genera el recurso): Nota informativa de 150 a 200 palabras sobre una protesta estudiantil (real o verosímil, sin cifras inventadas atribuidas a fuentes reales), con al menos cuatro elecciones léxicas marcadas (adjetivos, verbos de acción, sustantivos valorativos) y tono claramente identificable; debe permitir subrayar elecciones y describir su efecto emocional en el lector. Nivel: 8° Básico. Buscar: nota informativa protesta estudiantil lenguaje valorativo.","Respuesta esperada: Cada pareja nombra dos elecciones léxicas concretas del fragmento y describe el efecto emocional que produce cada una en el lector, usando el vínculo causa-efecto modelado en la fase anterior."],"status":"Pendiente","note":"","resourceLink":""},{"id":"S02-A4","phase":"Explicar y conectar","minutes":8,"text":"Comparten hallazgos; docente formula: 'Quien elige las palabras dirige la emoción del lector.' Contrastan si el efecto cambia según la audiencia prevista. [A2 · generalización conceptual]","details":["Recurso (lo presenta el docente): Sin material: discusión oral — El docente formula: 'Quien elige las palabras dirige la emoción del lector.' Pregunta para contrastar: ¿cambiaría el efecto si el texto estuviera dirigido a una audiencia diferente? ¿Por qué?","Respuesta esperada: Estudiantes prueban la generalización con sus hallazgos: argumentan si el efecto depende solo de la palabra elegida o también de quién lee, mostrando comprensión del vínculo elección-audiencia-efecto."],"status":"Pendiente","note":"","resourceLink":""},{"id":"S02-A5","phase":"Demostrar y reflexionar","minutes":5,"text":"Cada estudiante escribe una oración: nombra una elección del texto y explica su efecto con una palabra de emoción o juicio. [A2 · evidencia individual]","details":["Recurso (lo presenta el docente): Ficha individual de cierre con consigna — Escribe una oración completa con esta estructura: 'En el texto, la elección de [palabra o expresión] produce en el lector [emoción o juicio] porque [razón breve].' Usa una elección del fragmento trabajado hoy.","Respuesta esperada: Oración que nombra una elección léxica específica del texto, la vincula a una emoción o juicio preciso en el lector y ofrece una razón que justifica ese vínculo de forma coherente."],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Dos titulares impresos sobre el mismo evento vistos desde perspectivas opuestas, Fragmento breve de nota informativa sobre protesta estudiantil (150 palabras máx), Mini-pizarras o tarjetas de respuesta individual","Aporte al enunciado de indagación":"Quien elige el léxico dirige qué siente y entiende la audiencia sobre el poder.","Retroalimentación":"Docente circula en fase 3 y señala si la explicación del efecto nombra una emoción o juicio concreto del lector, no solo describe la palabra.","Evidencia individual esperada":"Oración que nombra una elección léxica y explica su efecto emocional en el lector; se mira precisión del vínculo causa-efecto. [A2]","Conocimiento esencial":"Elecciones léxicas y de tono producen efectos emocionales y cognitivos en lectores."},"note":"","date":""},{"id":3,"week":1,"day":"Jueves","minutes":40,"header":"Sesión 3 · Semana 1 · Jueves · 40 min (1 módulo) [A3] (EE1, EE2, EE3, EE6) {FC06} · Justificar con ejemplos y terminología específica por qué el poder condiciona lo que se dice y cómo. · modelado","objective":"Justificar con ejemplos y terminología específica por qué el poder condiciona lo que se dice y cómo.","mode":"modelado","codes":"A3","activities":[{"id":"S03-A1","phase":"Conectar y cuestionar","minutes":5,"text":"Observan dos titulares opuestos sobre la misma protesta social. ¿Qué justifica cada titular? [A3 · activar criterio de justificación]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S03-A2","phase":"Equipar al estudiante","minutes":7,"text":"Se define justificación válida: afirmación + ejemplo + explicación + término técnico. Docente modela con un titular. Criterios: claridad, evidencia, vocabulario. Verificación rápida: estudiantes escriben un ejemplo en mini-pizarra. [A3 · modelado explícito]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S03-A3","phase":"Investigar y aplicar","minutes":15,"text":"Individualmente escriben tres justificaciones breves sobre cómo el poder elige qué decir, usando los titulares y terminología (sesgo, omisión, encuadre). Docente retroalimenta contra criterios. [A3 · práctica escrita con evidencia]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S03-A4","phase":"Explicar y conectar","minutes":8,"text":"Comparten dos justificaciones; identifican cuál usa mejor evidencia y por qué. Generalizan: quien controla el discurso decide qué perspectiva llega al lector. [A3 · consolidar generalización]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S03-A5","phase":"Demostrar y reflexionar","minutes":5,"text":"Cada estudiante escribe una justificación nueva usando un término técnico distinto a los anteriores y señala qué revisaría para mejorarla. [A3 · evidencia individual]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Dos titulares impresos o proyectados sobre la misma protesta desde medios con distintas líneas editoriales, Mini-pizarras o tarjetas de respuesta rápida, Rúbrica de justificación con tres criterios en lenguaje de estudiante","Aporte al enunciado de indagación":"Quien tiene poder elige el encuadre; justificar esa elección revela perspectiva.","Retroalimentación":"Docente revisa mini-pizarras tras fase 2 y retroalimenta durante fase 3 contra criterios de justificación.","Evidencia individual esperada":"Justificación escrita individual con término técnico nuevo; se observa estructura afirmación-evidencia-explicación. [A3]","Conocimiento esencial":"Justificación válida: afirmación, ejemplo, explicación y término técnico asociado al poder discursivo."},"note":"","date":""},{"id":4,"week":1,"day":"Jueves","minutes":40,"header":"Sesión 4 · Semana 1 · Jueves · 40 min (1 módulo) [A4] (EE1, EE2, EE3, EE4, EE6) {FC06} · Comparar cómo dos géneros textuales distintos construyen la misma realidad social según quién tiene el poder de narrarla. · modelado","objective":"Comparar cómo dos géneros textuales distintos construyen la misma realidad social según quién tiene el poder de narrarla.","mode":"modelado","codes":"A4","activities":[{"id":"S04-A1","phase":"Conectar y cuestionar","minutes":5,"text":"Se proyectan dos textos breves sobre el mismo hecho: una nota informativa oficial y un testimonio personal de alguien afectado. ¿Qué diferencias notas entre cómo cada texto construye lo que ocurrió? [A4 · activar observación comparativa]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S04-A2","phase":"Equipar al estudiante","minutes":7,"text":"Se declara: 'Hoy compararemos características entre géneros para ver cómo la forma cambia lo que se puede entender.' Criterios: (1) identifico al menos una diferencia estructural, (2) identifico una diferencia de lenguaje, (3) explico qué efecto produce cada diferencia. El docente modela comparando voz, tiempo verbal y tono en ambos textos. Verificación rápida: cada estudiante señala una diferencia en mini-pizarra. [A4 · modelado de comparación entre géneros]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S04-A3","phase":"Investigar y aplicar","minutes":15,"text":"En parejas, cada estudiante recibe una tabla de dos columnas. Comparan el texto oficial y el testimonio anotando: estructura, léxico, voz narrativa y propósito. Luego escriben una oración que explique qué puede ver o no cada lector según el género leído. El docente retroalimenta contra los tres criterios antes de que cada pareja revise su oración. [A4 · comparar características entre géneros con evidencia]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S04-A4","phase":"Explicar y conectar","minutes":8,"text":"Cada pareja comparte su oración. Juntos ponen a prueba la idea: 'El género que usa quien tiene poder determina qué aspectos de la realidad quedan visibles.' Se discute si hay casos donde el género subordinado muestra más o si hay otras variables. [A4 · generalización sobre género y poder]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S04-A5","phase":"Demostrar y reflexionar","minutes":5,"text":"Individualmente, cada estudiante escribe dos oraciones: una diferencia clave entre los géneros y qué investigaría si leyera un tercer género sobre el mismo hecho. [A4 · evidencia individual de transferencia]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Nota informativa institucional breve sobre un hecho social local, Testimonio personal del mismo hecho (voz afectada por desigualdad), Tabla comparativa impresa o proyectada de dos columnas, Mini-pizarras o papel para verificación rápida","Aporte al enunciado de indagación":"El género elegido por quien tiene poder filtra qué puede ver cada lector.","Retroalimentación":"El docente revisa oraciones de síntesis en fase 3 contra los tres criterios y señala si la diferencia identificada es estructural, léxica o de voz.","Evidencia individual esperada":"Dos oraciones individuales: una diferencia entre géneros y una pregunta de transferencia a un tercer texto. Se mira precisión del contraste [A4].","Conocimiento esencial":"Diferencias estructurales y lingüísticas entre géneros según posición de poder del emisor."},"note":"","date":""},{"id":5,"week":2,"day":"Lunes","minutes":80,"header":"Sesión 5 · Semana 2 · Lunes · 80 min (2 módulos) [A1] (EE1, EE2, EE3, EE4, EE6) {FC06} · Identificar y explicar contenido, contexto, lenguaje, estructura y técnica en textos sobre poder y discurso. · modelado","objective":"Identificar y explicar contenido, contexto, lenguaje, estructura y técnica en textos sobre poder y discurso.","mode":"modelado","codes":"A1","activities":[{"id":"S05-A1","phase":"Conectar y cuestionar","minutes":10,"text":"Comparan dos titulares sobre el mismo hecho: uno de medio oficial y otro independiente. ¿Qué elige cada texto mostrar y qué silencia? [A1 · activar análisis textual]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S05-A2","phase":"Equipar al estudiante","minutes":14,"text":"Se define qué es contexto, estructura y técnica con modelo en pizarra usando el titular oficial. Criterios: identificar al menos dos elecciones textuales y explicar su función. Verificación: en una tarjeta señalan una elección del titular independiente. [A1 · modelado explícito]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S05-A3","phase":"Investigar y aplicar","minutes":30,"text":"En parejas analizan un fragmento de discurso institucional chileno sobre pobreza y uno de organización social sobre el mismo tema. Registran en tabla: elecciones de lenguaje, estructura y técnica, explicando qué construye cada una. El docente entrega retroalimentación oral a dos parejas contra los criterios. [A1 · análisis comparativo con evidencia]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S05-A4","phase":"Explicar y conectar","minutes":16,"text":"Comparten hallazgos y construyen la generalización: 'Quien controla el lenguaje y la estructura de un texto delimita lo que la audiencia puede ver'. Discuten variaciones entre los dos textos. [A1 · conexión con Perspectiva y poder]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S05-A5","phase":"Demostrar y reflexionar","minutes":10,"text":"Cada estudiante escribe dos oraciones explicando una elección textual del discurso institucional y su efecto, citando evidencia. ¿Qué analizarías en otro texto para poner a prueba esta idea? [A1 · evidencia individual]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Dos titulares impresos sobre mismo hecho (ej: titular MINEDUC vs. ONG educativa), Fragmento de discurso institucional chileno sobre pobreza (máx 150 palabras), Fragmento de comunicado de organización social sobre pobreza (máx 150 palabras), Tabla de registro impresa: elecciones textuales / función, Tarjetas de verificación individual","Aporte al enunciado de indagación":"El poder decide qué lenguaje y estructura usa el texto, limitando lo visible.","Retroalimentación":"Docente revisa tarjetas de verificación al cierre de fase 2 y tabla de análisis durante fase 3; reorienta parejas que confunden elección textual con tema.","Evidencia individual esperada":"Dos oraciones que explican una elección textual del discurso institucional con evidencia citada. [A1]","Conocimiento esencial":"Contexto, estructura, lenguaje y técnica como elecciones que construyen perspectiva en textos."},"note":"","date":""},{"id":6,"week":2,"day":"Martes","minutes":40,"header":"Sesión 6 · Semana 2 · Martes · 40 min (1 módulo) [A2] (EE1, EE2, EE3, EE6) · Identificar y explicar cómo las elecciones del creador producen efectos concretos en la audiencia dentro de contextos de poder. · modelado","objective":"Identificar y explicar cómo las elecciones del creador producen efectos concretos en la audiencia dentro de contextos de poder.","mode":"modelado","codes":"A2","activities":[{"id":"S06-A1","phase":"Conectar y cuestionar","minutes":5,"text":"Comparan dos titulares sobre el mismo hecho social: uno de medio oficial, uno comunitario. ¿Qué efecto produce cada titular en quien lo lee? [A2 · activar intuición sobre efecto]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S06-A2","phase":"Equipar al estudiante","minutes":7,"text":"Se aclara: 'Hoy identificarás cómo una elección lingüística específica genera un efecto concreto.' Criterios: (1) nombra la elección, (2) describe el efecto, (3) lo vincula a la audiencia. Docente modela con un adjetivo valorativo de un texto oficial. [A2 · modelado de la destreza]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S06-A3","phase":"Investigar y aplicar","minutes":15,"text":"En parejas, analizan un fragmento de discurso institucional sobre pobreza urbana: subrayan tres elecciones del creador y anotan el efecto probable en dos audiencias distintas (afectada vs. no afectada). Docente retroalimenta contra criterios antes del cierre. [A2 · práctica con retroalimentación]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S06-A4","phase":"Explicar y conectar","minutes":8,"text":"Comparten hallazgos: ¿cambia el efecto según quién recibe el mensaje? Conectan con la idea: 'Quien controla el lenguaje dirige lo que la audiencia siente o comprende.' [A2 · generalización sobre poder y efecto]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S06-A5","phase":"Demostrar y reflexionar","minutes":5,"text":"Cada estudiante escribe una oración que nombre una elección del texto, su efecto y la audiencia a la que apunta. Identifica qué ajustaría al analizar otro texto de poder. [A2 · evidencia individual escrita]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Dos titulares impresos sobre el mismo hecho social, Fragmento breve de discurso institucional sobre pobreza urbana, Rúbrica de criterios de logro en lenguaje de estudiante","Aporte al enunciado de indagación":"El creador elige palabras que orientan lo que la audiencia siente o comprende.","Retroalimentación":"Docente circula en fase 3 y verifica si los estudiantes nombran la elección concreta y no solo el tema general; reorienta con pregunta: '¿Qué palabra exacta produce ese efecto?'","Evidencia individual esperada":"Oración escrita que nombra elección, efecto y audiencia; se mira precisión y vínculo con poder. [A2]","Conocimiento esencial":"Elecciones lingüísticas del creador generan efectos específicos según audiencia y contexto de poder."},"note":"","date":""},{"id":7,"week":2,"day":"Jueves","minutes":40,"header":"Sesión 7 · Semana 2 · Jueves · 40 min (1 módulo) [B1] (EE1, EE2, EE3, EE4, EE6) {FC06} · Planificar y escribir un texto breve con estructura organizativa que sirva al propósito de visibilizar o silenciar una perspectiva. · modelado","objective":"Planificar y escribir un texto breve con estructura organizativa que sirva al propósito de visibilizar o silenciar una perspectiva.","mode":"modelado","codes":"B1","activities":[{"id":"S07-A1","phase":"Conectar y cuestionar","minutes":5,"text":"Se muestran dos titulares sobre el mismo hecho: uno de medio oficial, otro comunitario. Pregunta: ¿qué estructura usa cada uno y por qué? [B1 · activar conocimiento previo]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S07-A2","phase":"Equipar al estudiante","minutes":7,"text":"Se aclara criterio B1: la estructura debe responder al propósito. Se modela un párrafo de denuncia con apertura impactante, desarrollo con evidencia y cierre con llamado. Se entregan 3 criterios en lenguaje estudiante: apertura clara, evidencia incluida, cierre coherente con propósito. Verificación: cada estudiante señala en mini-pizarra qué estructura usaría para defender a quien no tiene voz. [B1 · modelado explícito]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S07-A3","phase":"Investigar y aplicar","minutes":15,"text":"En parejas, cada estudiante redacta un párrafo breve (voz de persona sin poder que denuncia silenciamiento) usando la estructura modelada. La pareja revisa el borrador del otro contra los 3 criterios y anota una mejora concreta. El escritor ajusta su texto según la retroalimentación. [B1 · práctica guiada con retroalimentación de pares]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S07-A4","phase":"Explicar y conectar","minutes":8,"text":"Dos parejas comparten sus párrafos. Clase evalúa si la estructura sirve al propósito: ¿la apertura engancha?, ¿la evidencia sostiene?, ¿el cierre impulsa acción? Se formula generalización: quien organiza el texto controla qué se percibe primero y qué queda. [B1 · conectar estructura con poder]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S07-A5","phase":"Demostrar y reflexionar","minutes":5,"text":"Individualmente, cada estudiante escribe una oración explicando qué decisión estructural tomó y cómo esa elección cambia lo que el lector puede ver o entender. [B1 · evidencia individual de transferencia]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Dos titulares impresos sobre un mismo hecho (ej: protesta mapuche), Párrafo modelado por docente proyectado, Hoja de criterios B1 en lenguaje estudiante, Mini-pizarras o papel borrador","Aporte al enunciado de indagación":"Quien organiza el texto decide qué se ve primero y qué queda oculto.","Retroalimentación":"El docente revisa borradores en fase 3 y reorienta a quien no ancla la estructura al propósito declarado.","Evidencia individual esperada":"Oración individual explicando decisión estructural propia y su efecto en el lector; se mira coherencia entre propósito y estructura. [B1]","Conocimiento esencial":"Estructura textual como herramienta de propósito: apertura, evidencia y cierre."},"note":"","date":""},{"id":8,"week":2,"day":"Jueves","minutes":40,"header":"Sesión 8 · Semana 2 · Jueves · 40 min (1 módulo) [B2] (EE2, EE3, EE4, EE6) {FC06} · Organizar un párrafo de opinión de forma coherente y lógica sobre poder y lenguaje. · práctica guiada","objective":"Organizar un párrafo de opinión de forma coherente y lógica sobre poder y lenguaje.","mode":"práctica guiada","codes":"B2","activities":[{"id":"S08-A1","phase":"Conectar y cuestionar","minutes":5,"text":"Se muestran dos versiones de un mismo párrafo de opinión (una sin estructura clara, otra con tesis-evidencia-explicación). ¿Cuál convence más y por qué? [B2 · activar conocimiento previo sobre coherencia]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S08-A2","phase":"Equipar al estudiante","minutes":7,"text":"Se declara la intención: organizar párrafos de opinión con estructura tesis-evidencia-explicación. Tres criterios: tesis clara, evidencia relevante, explicación conectada. El docente modela escribiendo una oración de cada parte sobre un titular real que silencia voces marginadas. [B2 · modelado explícito]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S08-A3","phase":"Investigar y aplicar","minutes":15,"text":"En parejas, cada estudiante escribe un párrafo de opinión usando una noticia breve donde quien tiene poder elige qué voces se oyen. Aplican estructura tesis-evidencia-explicación; pares intercambian y verifican los tres criterios. [B2 · práctica guiada con retroalimentación entre pares]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S08-A4","phase":"Explicar y conectar","minutes":8,"text":"Tres parejas comparten su oración de tesis. Grupo evalúa coherencia y conexión lógica entre partes. Docente sintetiza: la estructura organiza el argumento y hace visible quién controla el mensaje. [B2 · consolidar comprensión conceptual]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S08-A5","phase":"Demostrar y reflexionar","minutes":5,"text":"Cada estudiante escribe individualmente su mejor oración explicativa e identifica qué parte de su párrafo necesita mejorar. [B2 · evidencia individual de producción escrita]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Dos versiones del párrafo de opinión impresas o proyectadas, Titular de prensa chilena reciente sobre silenciamiento de voces indígenas o migrantes, Rúbrica de tres criterios en lenguaje de estudiante, Hoja de trabajo para escritura del párrafo","Aporte al enunciado de indagación":"Quien organiza el argumento decide qué voces y evidencias se hacen visibles.","Retroalimentación":"Docente circula en fase 3 y señala si la explicación conecta tesis con evidencia; pares usan rúbrica de tres criterios para retroalimentar.","Evidencia individual esperada":"Oración explicativa individual escrita sin ayuda; se mira si conecta tesis y evidencia. [B2]","Conocimiento esencial":"Párrafo de opinión estructurado: tesis, evidencia y explicación conectadas lógicamente."},"note":"","date":""},{"id":9,"week":3,"day":"Lunes","minutes":80,"header":"Sesión 9 · Semana 3 · Lunes · 80 min (2 módulos) [B3] (EE1, EE2, EE3, EE4, EE6) {FC06} · Aplicar herramientas de formato y referencia para producir un texto de presentación adecuado al contexto de poder y privilegio. · modelado","objective":"Aplicar herramientas de formato y referencia para producir un texto de presentación adecuado al contexto de poder y privilegio.","mode":"modelado","codes":"B3","activities":[{"id":"S09-A1","phase":"Conectar y cuestionar","minutes":10,"text":"Se proyectan dos versiones del mismo informe sobre desigualdad educativa: una sin formato ni citas, otra con títulos, fuentes y estructura clara. ¿Qué versión comunica más autoridad y por qué? [B3 · activar conocimiento previo sobre formato]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S09-A2","phase":"Equipar al estudiante","minutes":14,"text":"Se modela cómo aplicar tres herramientas concretas: título orientador, cita de fuente con referencia breve y recuadro de datos. Criterios: (1) el formato sirve la intención, (2) la fuente está identificada, (3) el estilo es coherente. Verificación: los estudiantes muestran en mini-pizarra un título que inventaron para su texto. [B3 · modelado de herramientas de presentación]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S09-A3","phase":"Investigar y aplicar","minutes":30,"text":"En parejas, cada estudiante redacta un texto breve de denuncia o exposición sobre desigualdad lingüística, aplicando las tres herramientas modeladas. Un par revisa contra los tres criterios y anota una sugerencia escrita concreta; el autor ajusta el texto antes de terminar la fase. [B3 · producción con retroalimentación de pares]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S09-A4","phase":"Explicar y conectar","minutes":16,"text":"Comparten dos ejemplos contrastantes: uno con formato efectivo, uno con debilidades. Discuten: ¿cuándo el formato mismo es un acto de poder? Formulan la idea: 'Quien controla la presentación controla qué se percibe como legítimo.' [B3 · EE2 · conexión concepto-herramienta]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S09-A5","phase":"Demostrar y reflexionar","minutes":10,"text":"Cada estudiante entrega su texto ajustado con una nota de una oración: qué herramienta de formato usó para reforzar su propósito y qué cambiaría si el destinatario fuera distinto. [B3 · evidencia individual de transferencia]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Dos versiones del mismo informe sobre brecha educativa (preparadas por el docente), Guía visual de tres herramientas de formato (título, cita, recuadro), Mini-pizarras o tarjetas de respuesta rápida, Rúbrica de tres criterios en lenguaje de estudiante","Aporte al enunciado de indagación":"El formato y las referencias deciden qué voces parecen legítimas ante otros.","Retroalimentación":"El docente revisa las notas finales para identificar quién no transfirió la herramienta al nuevo destinatario y reagrupa en la hora siguiente.","Evidencia individual esperada":"Texto de denuncia con tres herramientas aplicadas; se mira coherencia entre formato elegido e intención declarada. [B3]","Conocimiento esencial":"Herramientas de formato: título, cita referenciada y recuadro de datos al servicio de la intención."},"note":"","date":""},{"id":10,"week":3,"day":"Martes","minutes":40,"header":"Sesión 10 · Semana 3 · Martes · 40 min (1 módulo) [C1, C2] (EE1, EE2, EE3, EE5) {FC06} · Producir un texto breve desde una perspectiva silenciada, revelando cómo el poder limita lo que se puede expresar. · modelado","objective":"Producir un texto breve desde una perspectiva silenciada, revelando cómo el poder limita lo que se puede expresar.","mode":"modelado","codes":"C1, C2","activities":[{"id":"S10-A1","phase":"Conectar y cuestionar","minutes":5,"text":"Se proyectan dos titulares sobre el mismo evento: uno oficial y uno comunitario marginalizado. ¿Qué voz está ausente y por qué? [C1 · activar perspectiva]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S10-A2","phase":"Equipar al estudiante","minutes":7,"text":"Intención: escribir desde una voz silenciada. Criterios: voz reconocible, detalle concreto del contexto, tensión entre lo que se dice y lo que se calla. Docente modela un párrafo breve en primera persona desde un personaje sin poder. [C1 · modelado de producción]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S10-A3","phase":"Investigar y aplicar","minutes":15,"text":"Cada estudiante elige una voz silenciada del mismo evento y escribe un monólogo interno de 8-10 líneas. Par lee y señala qué criterio está más logrado. Escritor ajusta una oración. [C1 · C2 · producción con retroalimentación]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S10-A4","phase":"Explicar y conectar","minutes":8,"text":"Dos voluntarios comparten su monólogo. Clase identifica qué elecciones de lenguaje revelan la limitación de poder. Docente conecta: la perspectiva elegida construye lo visible y lo invisible. [C1 · C2 · conexión conceptual]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S10-A5","phase":"Demostrar y reflexionar","minutes":5,"text":"Cada estudiante escribe una oración final: qué cambiaría en su texto si la voz silenciada tuviera poder, y por qué eso importa. [C1 · transferencia reflexiva]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Dos titulares impresos o proyectados sobre un mismo hecho (uno institucional, uno comunitario), Hoja de escritura o cuaderno, Rúbrica de criterios de logro simplificada en lenguaje de estudiante","Aporte al enunciado de indagación":"Quien no tiene poder elige su voz; escribirla revela lo que el discurso dominante oculta.","Retroalimentación":"Par señala qué criterio está más logrado; escritor ajusta antes del cierre.","Evidencia individual esperada":"Monólogo de 8-10 líneas desde voz silenciada; se observa si la perspectiva revela limitación de poder. [C1]","Conocimiento esencial":"Voz narrativa, perspectiva, tensión entre lo dicho y lo silenciado en contextos de poder."},"note":"","date":""},{"id":11,"week":3,"day":"Jueves","minutes":40,"header":"Sesión 11 · Semana 3 · Jueves · 40 min (1 módulo) [C2] (EE1, EE2, EE3, EE6) {FC06} · Seleccionar detalles y ejemplos relevantes para argumentar cómo el poder decide qué información circula. · modelado","objective":"Seleccionar detalles y ejemplos relevantes para argumentar cómo el poder decide qué información circula.","mode":"modelado","codes":"C2","activities":[{"id":"S11-A1","phase":"Conectar y cuestionar","minutes":5,"text":"Se muestran dos titulares sobre el mismo hecho desde medios con distinto poder editorial. ¿Qué detalle eligió cada medio y por qué? [C2 · activar selección]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S11-A2","phase":"Equipar al estudiante","minutes":7,"text":"Docente modela en voz alta cómo elegir UN detalle concreto que sostenga una idea sobre poder informativo; criterios: relevancia, especificidad, conexión directa con la idea. [C2 · modelado]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S11-A3","phase":"Investigar y aplicar","minutes":15,"text":"En parejas, cada estudiante escribe un párrafo breve eligiendo dos detalles del titular que mejor evidencian cómo el poder filtra la información; docente revisa selecciones contra criterios. [C2 · producción guiada]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S11-A4","phase":"Explicar y conectar","minutes":8,"text":"Comparten selecciones y contrastan qué detalles eligieron distintas parejas; docente formula: 'Elegir un detalle es ya un acto de poder sobre la comprensión del lector.' [C2 · conexión conceptual]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S11-A5","phase":"Demostrar y reflexionar","minutes":5,"text":"Cada estudiante escribe una oración nueva que use un detalle propio para sostener la idea central de la unidad. Se identifica qué hace ese detalle relevante. [C2 · evidencia individual]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Dos titulares impresos del mismo hecho desde medios de distinto alcance o propiedad, Hoja de criterios de selección de detalles, Pizarra para registrar comparación de elecciones","Aporte al enunciado de indagación":"Elegir un detalle reproduce el poder de quien decide qué es visible.","Retroalimentación":"Docente señala en voz alta si el detalle elegido conecta directamente con la idea o solo la roza; ajusta en el momento.","Evidencia individual esperada":"Oración propia con detalle seleccionado; se observa si el detalle sostiene la idea sin ser vago. [C2]","Conocimiento esencial":"El estudiante identifica qué hace relevante un detalle para sostener una idea argumentativa."},"note":"","date":""},{"id":12,"week":3,"day":"Jueves","minutes":40,"header":"Sesión 12 · Semana 3 · Jueves · 40 min (1 módulo) [D1] (EE1, EE2, EE3, EE4, EE6) {FC06} · Producir oraciones y expresiones variadas que representen el mismo hecho desde distintas posiciones de poder. · modelado","objective":"Producir oraciones y expresiones variadas que representen el mismo hecho desde distintas posiciones de poder.","mode":"modelado","codes":"D1","activities":[{"id":"S12-A1","phase":"Conectar y cuestionar","minutes":5,"text":"Se proyectan dos titulares opuestos sobre el mismo conflicto laboral: uno corporativo, uno sindical. ¿Cómo cambia el vocabulario según quién escribe? [D1 · activar conocimiento previo]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S12-A2","phase":"Equipar al estudiante","minutes":7,"text":"Se aclara que hoy se practicará variar vocabulario y estructura oracional para cambiar perspectiva. Docente modela transformar una oración pasiva en activa y sustituir términos neutros por cargados, mostrando el efecto. Criterios: (1) usa al menos dos estructuras oracionales distintas, (2) elige vocabulario no casual, (3) el tono refleja posición. Verificación: cada estudiante escribe en papel una oración de ejemplo antes de continuar. [D1 · modelado de variación léxico-sintáctica]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S12-A3","phase":"Investigar y aplicar","minutes":15,"text":"En parejas reciben una ficha con cinco hechos breves sobre una política pública que beneficia a un grupo sobre otro. Cada estudiante reescribe los mismos hechos dos veces: una desde la perspectiva del grupo con poder y otra desde el grupo afectado, variando vocabulario y estructuras oracionales. Pares intercambian textos y señalan con color qué elecciones cambian el efecto. Docente circula y retroalimenta contra los tres criterios antes de que cada uno ajuste su segunda versión. [D1 · producción activa con retroalimentación inmediata]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S12-A4","phase":"Explicar y conectar","minutes":8,"text":"Comparten dos ejemplos contrastantes en voz alta. Docente guía hacia la generalización: quien controla el lenguaje dirige lo que el lector puede imaginar como normal o posible. [D1 · EE2 · consolidar idea conceptual]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S12-A5","phase":"Demostrar y reflexionar","minutes":5,"text":"Cada estudiante escribe tres oraciones sobre un hecho nuevo (acceso desigual a educación) variando estructura y léxico para representar dos posiciones distintas, e indica cuál elección considera más poderosa y por qué. [D1 · evidencia individual de producción autónoma]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Ficha impresa con cinco hechos sobre política pública desigual, Dos titulares proyectables de conflicto laboral, Destacadores de dos colores por pareja","Aporte al enunciado de indagación":"Quien tiene poder elige palabras que moldean lo visible para otros.","Retroalimentación":"Docente revisa fichas de parejas durante fase 3 y señala qué elecciones cumplen los tres criterios antes del ajuste.","Evidencia individual esperada":"Tres oraciones con variación léxico-sintáctica sobre educación desigual; se observa si la elección de vocabulario refleja posición de poder. [D1]","Conocimiento esencial":"Variación léxica y sintáctica construye perspectiva e impacto sobre la audiencia."},"note":"","date":""},{"id":13,"week":4,"day":"Lunes","minutes":80,"header":"Sesión 13 · Semana 4 · Lunes · 80 min (2 módulos) [D2] (EE1, EE2, EE3, EE4, EE6) {FC06} · Producir texto oral o escrito ajustando registro y estilo según quién tiene poder para hablar en contextos de equidad. · modelado · Hito formativo","objective":"modelado","mode":"Hito formativo","codes":"D2","activities":[{"id":"S13-A1","phase":"Conectar y cuestionar","minutes":10,"text":"Se proyectan dos versiones del mismo mensaje sobre una protesta estudiantil: una en registro formal institucional y otra en jerga juvenil informal. Pregunta: ¿Por qué el emisor elige ese registro y qué poder le da o le quita? [D2 · activar conocimiento previo sobre registro]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S13-A2","phase":"Equipar al estudiante","minutes":14,"text":"Se aclara que registro adecuado significa ajustar vocabulario, tono y estructura al destinatario y propósito. Criterios: (1) el texto identifica al destinatario con precisión, (2) el vocabulario y tono son consistentes, (3) el estilo refuerza el propósito. Docente modela reescribiendo un párrafo de protesta para dos audiencias distintas en voz alta. [D2 · modelado explícito de ajuste de registro]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S13-A3","phase":"Investigar y aplicar","minutes":30,"text":"En parejas, cada estudiante elige un rol con distinto poder social (dirigente estudiantil, funcionario municipal, periodista comunitario) y escribe dos versiones breves del mismo reclamo: una al par de igual poder y otra a la autoridad. Pares intercambian textos y verifican los tres criterios; el escritor recibe retroalimentación y ajusta su texto antes de compartir. [D2 · práctica guiada con retroalimentación entre pares]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S13-A4","phase":"Explicar y conectar","minutes":16,"text":"Tres parejas leen sus versiones contrastadas; el grupo identifica qué elecciones de registro amplifican o limitan la voz del hablante. Docente plantea: 'El registro no es neutro: legitima o silencia perspectivas según quién tenga poder para hablar.' [D2 · conexión con concepto Perspectiva y enunciado de indagación]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S13-A5","phase":"Demostrar y reflexionar","minutes":10,"text":"Cada estudiante escribe individualmente un párrafo breve desde el rol menos poderoso hacia una autoridad, aplicando el registro más estratégico posible, y anota qué elección de estilo consideró más difícil y por qué. [D2 · evidencia individual de producción con registro ajustado]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Dos versiones impresas del mensaje sobre protesta estudiantil, Rúbrica con los tres criterios de registro en lenguaje de estudiante, Tarjetas de rol con descripción breve de posición social y propósito comunicativo","Aporte al enunciado de indagación":"El registro elegido refleja y reproduce quién tiene poder para ser escuchado.","Retroalimentación":"Docente lee tres párrafos anónimos en voz alta; grupo identifica aciertos y tensiones en el registro elegido.","Evidencia individual esperada":"Párrafo individual con registro ajustado; se observa consistencia de tono y vocabulario según destinatario. [D2]","Conocimiento esencial":"Registro formal e informal, ajuste de tono y vocabulario según destinatario y propósito comunicativo."},"note":"","date":""},{"id":14,"week":4,"day":"Martes","minutes":40,"header":"Sesión 14 · Semana 4 · Martes · 40 min (1 módulo) [D3] (EE2, EE3, EE4, EE6) · Usar gramática, sintaxis y puntuación correctas al escribir sobre poder y lenguaje. · práctica guiada","objective":"Usar gramática, sintaxis y puntuación correctas al escribir sobre poder y lenguaje.","mode":"práctica guiada","codes":"D3","activities":[{"id":"S14-A1","phase":"Conectar y cuestionar","minutes":5,"text":"Leen dos titulares: uno con coma de vocativo ausente y otro con subordinada mal construida. Responden: ¿qué cambia en el significado cuando la puntuación falla? [D3 · activar conocimiento previo]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S14-A2","phase":"Equipar al estudiante","minutes":7,"text":"Docente modela en pizarra la corrección de una oración con gerundio mal usado y una coma ausente en un texto sobre inequidad mediática. Criterios: oración completa, coma correcta, verbo conjugado. [D3 · modelado explícito]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S14-A3","phase":"Investigar y aplicar","minutes":15,"text":"En parejas reescriben tres párrafos breves sobre silenciamiento de voces minoritarias: corrigen subordinadas, puntuación y concordancia usando lista de verificación. Docente da retroalimentación inmediata a dos pares. [D3 · práctica guiada con retroalimentación]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S14-A4","phase":"Explicar y conectar","minutes":8,"text":"Comparten correcciones; discuten cómo errores gramaticales debilitan la autoridad de quien denuncia inequidad. Generalizan: la corrección gramatical sostiene la credibilidad del emisor. [D3 · conexión con perspectiva y poder]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S14-A5","phase":"Demostrar y reflexionar","minutes":5,"text":"Cada estudiante corrige individualmente una oración nueva sobre privilegio comunicativo y anota qué regla aplicó. [D3 · evidencia individual]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Pizarra o proyector, Lista de verificación gramatical impresa, Tres párrafos cortos preparados por docente sobre silenciamiento mediático, Hoja de oración nueva para fase 5","Aporte al enunciado de indagación":"La gramática correcta sostiene la credibilidad de quien cuestiona el poder comunicativo.","Retroalimentación":"Docente revisa oraciones individuales de fase 5 y señala patrón de error más frecuente para reteaching.","Evidencia individual esperada":"Oración corregida sobre privilegio comunicativo; se mira aplicación correcta de puntuación y sintaxis. [D3]","Conocimiento esencial":"Reglas de puntuación, subordinación y concordancia aplicadas a textos sobre inequidad."},"note":"","date":""},{"id":15,"week":4,"day":"Jueves","minutes":40,"header":"Sesión 15 · Semana 4 · Jueves · 40 min (1 módulo) [B1] (EE1, EE2, EE3, EE4, EE6) {FC06} · Estructurar un texto breve con organización que sirva al propósito de visibilizar una perspectiva silenciada sobre poder y privilegio. · modelado","objective":"Estructurar un texto breve con organización que sirva al propósito de visibilizar una perspectiva silenciada sobre poder y privilegio.","mode":"modelado","codes":"B1","activities":[{"id":"S15-A1","phase":"Conectar y cuestionar","minutes":5,"text":"Se proyectan dos fragmentos: uno con estructura cronológica, otro con estructura problema-solución; ambos sobre la misma noticia de desigualdad. ¿Qué estructura comunica mejor quién tiene el poder? [B1 · activar comprensión previa]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S15-A2","phase":"Equipar al estudiante","minutes":7,"text":"Se declara la intención: estructurar textos según propósito. Se modela cómo elegir una estructura organizativa según lo que se quiere lograr: denunciar, persuadir o informar. Criterios: (1) estructura visible y coherente, (2) responde al propósito, (3) organiza la perspectiva con lógica. Verificación: en mini-pizarra, cada estudiante escribe qué estructura usaría para denunciar. [B1 · modelar elección estructural]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S15-A3","phase":"Investigar y aplicar","minutes":15,"text":"En parejas, escriben un párrafo inicial de texto de opinión usando la estructura problema-consecuencia-responsable, sobre una situación de privilegio que silencia voces. Reciben retroalimentación del compañero verificando los tres criterios antes de continuar. [B1 · práctica guiada de estructuración con retroalimentación]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S15-A4","phase":"Explicar y conectar","minutes":8,"text":"Comparten estructuras elegidas; discuten si la organización cambia lo que el lector puede ver o entender. Generalizan: 'La estructura de un texto no es neutral; refleja quién tiene el poder de nombrar el problema.' [B1 · conectar estructura con enunciado de indagación]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S15-A5","phase":"Demostrar y reflexionar","minutes":5,"text":"Individualmente, cada estudiante escribe una oración que explique por qué eligió esa estructura y cómo sirve a su propósito. Señala un ajuste que haría si cambiara la audiencia. [B1 · reflexión sobre decisión estructural autónoma]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Dos fragmentos impresos o proyectados sobre la misma noticia con estructuras distintas, Pizarra o mini-pizarras individuales, Hoja de trabajo con estructura problema-consecuencia-responsable guiada","Aporte al enunciado de indagación":"Elegir cómo estructurar un texto es un acto de poder que moldea lo que otros comprenden.","Retroalimentación":"El docente revisa las mini-pizarras durante la fase 2 y circula en la fase 3 para ajustar estructuras antes de que el estudiante continúe.","Evidencia individual esperada":"Oración individual que justifica la estructura elegida; se observa si vincula organización con propósito del texto. [B1]","Conocimiento esencial":"Estructuras organizativas textuales según propósito: cronológica, problema-solución, problema-consecuencia-responsable."},"note":"","date":""},{"id":16,"week":4,"day":"Jueves","minutes":40,"header":"Sesión 16 · Semana 4 · Jueves · 40 min (1 módulo) [B2] (EE1, EE2, EE3, EE4, EE6) {FC06} · Organizar un texto breve sobre poder y lenguaje con estructura coherente y lógica. · práctica guiada","objective":"Organizar un texto breve sobre poder y lenguaje con estructura coherente y lógica.","mode":"práctica guiada","codes":"B2","activities":[{"id":"S16-A1","phase":"Conectar y cuestionar","minutes":5,"text":"Observan dos titulares sobre el mismo hecho desde medios con distinto poder. ¿Qué orden de ideas usó cada medio para posicionar al lector? [B2 · activar esquema organizativo]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S16-A2","phase":"Equipar al estudiante","minutes":7,"text":"Docente modela en pizarra cómo ordenar tres ideas sobre poder y lenguaje: tesis, argumento con ejemplo, cierre. Criterios: idea central clara, secuencia sin saltos, cierre que retoma la tesis. [B2 · modelado de estructura]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S16-A3","phase":"Investigar y aplicar","minutes":15,"text":"En parejas, escriben un párrafo organizado sobre cómo un medio poderoso ordenó ideas para influir. Reciben retroalimentación de pares verificando los tres criterios antes de ajustar. [B2 · producción guiada con retroalimentación]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S16-A4","phase":"Explicar y conectar","minutes":8,"text":"Comparten estructuras y contrastan: ¿el orden cambia el efecto sobre el lector? Formulan: 'Quien organiza el discurso orienta la comprensión del receptor.' [B2 · generalización conceptual]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S16-A5","phase":"Demostrar y reflexionar","minutes":5,"text":"Cada estudiante escribe individualmente una afirmación sobre poder y lenguaje con tesis y un argumento ordenado; identifica qué ajustaría. [B2 · evidencia de organización autónoma]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Dos titulares impresos del mismo hecho, Pizarra o proyector para modelado, Rúbrica de tres criterios para coevaluación","Aporte al enunciado de indagación":"Quien organiza las ideas decide qué comprende primero el receptor.","Retroalimentación":"Docente revisa párrafos en fase 3 y señala quiebres lógicos antes del ajuste.","Evidencia individual esperada":"Párrafo individual con tesis y argumento ordenado; se mira coherencia y secuencia lógica. [B2]","Conocimiento esencial":"Estructura coherente: tesis, argumento con evidencia, cierre articulado."},"note":"","date":""},{"id":17,"week":5,"day":"Lunes","minutes":80,"header":"Sesión 17 · Semana 5 · Lunes · 80 min (2 módulos) · Evaluación sumativa · desempeño autónomo","objective":"Evaluación sumativa","mode":"desempeño autónomo","codes":"A, B, C y D","activities":[{"id":"S17-A1","phase":"Aplicación de la evaluación sumativa","minutes":80,"text":"Variante 2: El discurso que no escuchamos.","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"dos discursos auténticos o adaptados, tabla de análisis de perspectiva, hoja de respuesta estructurada","Conocimiento esencial":"Evaluación sumativa (horas reservadas)"},"note":"","date":""},{"id":18,"week":5,"day":"Martes","minutes":40,"header":"Sesión 18 · Semana 5 · Martes · 40 min (1 módulo) [B3] (EE2, EE3, EE4, EE6) {FC06} · Aplicar herramientas de formato y referencia para producir un texto con estilo adecuado al contexto de poder y privilegio. · modelado","objective":"Aplicar herramientas de formato y referencia para producir un texto con estilo adecuado al contexto de poder y privilegio.","mode":"modelado","codes":"B3","activities":[{"id":"S18-A1","phase":"Conectar y cuestionar","minutes":5,"text":"Observan dos versiones de la misma nota informativa: una sin formato ni fuentes, otra con encabezados, citas y referencias. Responden: ¿cuál text otorga más autoridad a quien escribe y por qué? [B3 · activar conocimiento previo]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S18-A2","phase":"Equipar al estudiante","minutes":7,"text":"Docente modela cómo insertar una cita textual, agregar nota al pie y elegir un encabezado que señale posición. Criterios: cita bien delimitada, referencia completa, encabezado que anticipe propósito. Verificación: estudiantes escriben en papel un encabezado de prueba. [B3 · modelado de herramienta]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S18-A3","phase":"Investigar y aplicar","minutes":15,"text":"En parejas, escriben un párrafo breve denunciando un caso de silenciamiento (ej: comunidad indígena sin acceso a medios). Deben incluir una cita, una referencia y un encabezado. Compañero revisa contra los tres criterios; escritor corrige. [B3 · práctica con retroalimentación de pares]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S18-A4","phase":"Explicar y conectar","minutes":8,"text":"Comparten encabezados y citas elegidas; discuten si el formato refuerza o debilita la perspectiva del autor. Generalizan: el formato no es neutro, construye autoridad y visibilidad para ciertos discursos. [B3 · conexión concepto Perspectiva]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S18-A5","phase":"Demostrar y reflexionar","minutes":5,"text":"Cada estudiante escribe una oración explicando cómo el formato que usó apoya su propósito y a qué audiencia se dirige. [B3 · evidencia individual]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Dos versiones impresas de nota informativa sobre acceso a medios, Guía de formato con modelo de cita y referencia, Hoja de revisión con tres criterios de logro","Aporte al enunciado de indagación":"El formato elige qué voces se ven como autoridad y cuáles desaparecen.","Retroalimentación":"El docente revisa encabezados y citas durante la fase 3; ajusta instrucción si más de la mitad omite la referencia completa.","Evidencia individual esperada":"Oración explicando cómo formato elegido apoya propósito y audiencia; se observa vínculo intencional formato-propósito. [B3]","Conocimiento esencial":"Herramientas de formato y referencia construyen autoridad y adecúan texto al contexto."},"note":"","date":""},{"id":19,"week":5,"day":"Jueves","minutes":40,"header":"Sesión 19 · Semana 5 · Jueves · 40 min (1 módulo) [C1] (EE1, EE2, EE3, EE6) {FC06} · Producir un texto breve desde una perspectiva silenciada, demostrando sensibilidad ante relaciones de poder y privilegio. · modelado","objective":"Producir un texto breve desde una perspectiva silenciada, demostrando sensibilidad ante relaciones de poder y privilegio.","mode":"modelado","codes":"C1","activities":[{"id":"S19-A1","phase":"Conectar y cuestionar","minutes":5,"text":"Se proyectan dos titulares sobre el mismo hecho: uno de medio oficial, uno comunitario. ¿Qué voz falta? [C1 · activar perspectiva]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S19-A2","phase":"Equipar al estudiante","minutes":7,"text":"Se aclara la intención: escribir desde quien no tiene poder. Se modela párrafo inicial con voz de personaje marginalizado. [C1 · modelado de producción]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S19-A3","phase":"Investigar y aplicar","minutes":15,"text":"Cada estudiante escribe un texto breve (8-10 oraciones) adoptando la voz de alguien sin privilegio ante el mismo hecho de los titulares. [C1 · producción activa]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S19-A4","phase":"Explicar y conectar","minutes":8,"text":"Tres voluntarios comparten; el grupo identifica qué elecciones revelan la perspectiva silenciada y conectan con el enunciado de indagación. [C1 · conexión conceptual]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S19-A5","phase":"Demostrar y reflexionar","minutes":5,"text":"Cada estudiante escribe una oración: qué decisión de escritura usó para mostrar que su voz carece de poder. [C1 · reflexión sobre proceso]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Par de titulares impresos o proyectados sobre un mismo evento local, Hoja de escritura o cuaderno del estudiante, Párrafo modelo del docente con voz marginalizada","Aporte al enunciado de indagación":"Quien carece de poder elige una voz propia para hacer visible lo que otros omiten.","Retroalimentación":"El docente lee dos textos y señala en voz alta qué elecciones léxicas muestran ausencia de privilegio.","Evidencia individual esperada":"Oración final del estudiante explicando su decisión de escritura; se mira coherencia entre voz y contexto de poder. [C1]","Conocimiento esencial":"Producción de voz narrativa desde perspectiva silenciada por relaciones de poder."},"note":"","date":""},{"id":20,"week":5,"day":"Jueves","minutes":40,"header":"Sesión 20 · Semana 5 · Jueves · 40 min (1 módulo) [C2] (EE1, EE2, EE3, EE6) {FC06} · Seleccionar detalles y ejemplos específicos que sustenten ideas sobre poder y lenguaje en un texto propio. · modelado","objective":"Seleccionar detalles y ejemplos específicos que sustenten ideas sobre poder y lenguaje en un texto propio.","mode":"modelado","codes":"C2","activities":[{"id":"S20-A1","phase":"Conectar y cuestionar","minutes":5,"text":"Se proyectan dos fragmentos breves: uno con detalles vagos y otro con ejemplos precisos sobre exclusión. ¿Qué fragmento convence más y por qué? [C2 · activar criterio de selección]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S20-A2","phase":"Equipar al estudiante","minutes":7,"text":"Se modela en voz alta cómo elegir UN detalle concreto sobre poder y descartar uno genérico, usando criterios: relevancia, especificidad, conexión con la idea central. [C2 · modelado de selección]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S20-A3","phase":"Investigar y aplicar","minutes":15,"text":"Cada estudiante escribe un párrafo breve sobre una situación de poder lingüístico real, seleccionando dos detalles justificados según los criterios. Docente da retroalimentación individual. [C2 · producción guiada con evidencia]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S20-A4","phase":"Explicar y conectar","minutes":8,"text":"Comparten un detalle elegido y explican por qué lo seleccionaron. Se construye generalización: detalles específicos hacen visible el poder que el lenguaje ejerce. [C2 · EE2 · consolidar criterio]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S20-A5","phase":"Demostrar y reflexionar","minutes":5,"text":"Cada estudiante anota qué detalle descartó y por qué, como evidencia de juicio selectivo aplicado de forma independiente. [C2 · reflexión metacognitiva]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Dos fragmentos impresos sobre exclusión lingüística en contextos de equidad, Hoja de criterios de selección (relevancia, especificidad, conexión), Cuaderno personal del estudiante","Aporte al enunciado de indagación":"Elegir detalles precisos hace visible cómo el poder moldea lo que se dice.","Retroalimentación":"Docente lee párrafos y señala si los detalles son específicos o genéricos antes de fase 4.","Evidencia individual esperada":"Párrafo con dos detalles justificados; se mira especificidad y conexión con idea central. [C2]","Conocimiento esencial":"Criterios para seleccionar detalles relevantes que desarrollen ideas con precisión."},"note":"","date":""},{"id":21,"week":6,"day":"Lunes","minutes":80,"header":"Sesión 21 · Semana 6 · Lunes · 80 min (2 módulos) · Evaluación sumativa · desempeño autónomo","objective":"Evaluación sumativa","mode":"desempeño autónomo","codes":"A, B, C y D","activities":[{"id":"S21-A1","phase":"Aplicación de la evaluación sumativa","minutes":80,"text":"Variante 2: El discurso que no escuchamos.","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"dos discursos auténticos o adaptados, tabla de análisis de perspectiva, hoja de respuesta estructurada","Conocimiento esencial":"Evaluación sumativa (horas reservadas)"},"note":"","date":""},{"id":22,"week":6,"day":"Martes","minutes":40,"header":"Sesión 22 · Semana 6 · Martes · 40 min (1 módulo) [D1] (EE2, EE3, EE4, EE6) · Usar vocabulario variado, estructuras oracionales diversas y formas de expresión distintas al escribir sobre poder y lenguaje. · práctica guiada","objective":"Usar vocabulario variado, estructuras oracionales diversas y formas de expresión distintas al escribir sobre poder y lenguaje.","mode":"práctica guiada","codes":"D1","activities":[{"id":"S22-A1","phase":"Conectar y cuestionar","minutes":5,"text":"Leen dos titulares sobre el mismo hecho: uno de medio oficial, uno alternativo. ¿Qué palabras revelan quién tiene poder para nombrar? [D1 · activar conocimiento previo]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S22-A2","phase":"Equipar al estudiante","minutes":7,"text":"El docente modela cómo reescribir una oración simple usando tres estructuras distintas (yuxtaposición, subordinación, pregunta retórica) manteniendo el mismo contenido. Criterios: vocabulario preciso, variación estructural, expresión no repetitiva. [D1 · modelado explícito]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S22-A3","phase":"Investigar y aplicar","minutes":15,"text":"En parejas, reescriben tres oraciones sobre exclusión o privilegio usando vocabulario específico y estructuras variadas; un par comparte y el docente retroalimenta contra criterios. [D1 · práctica guiada con retroalimentación]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S22-A4","phase":"Explicar y conectar","minutes":8,"text":"Comparan versiones: ¿qué estructura comunica más poder o urgencia? Conectan con la idea: quien controla la forma del lenguaje amplifica o silencia perspectivas. [D1 · conexión conceptual]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S22-A5","phase":"Demostrar y reflexionar","minutes":5,"text":"Cada estudiante reescribe sola/solo una oración nueva usando al menos dos recursos distintos e identifica cuál cambia más el efecto. [D1 · evidencia individual]","details":[],"status":"Pendiente","note":"","resourceLink":""}],"extras":{"Materiales sugeridos":"Dos titulares impresos sobre el mismo hecho, Pizarra o proyector para modelado, Hoja de trabajo con tres oraciones base sobre poder y exclusión","Aporte al enunciado de indagación":"La forma en que se estructura el lenguaje amplifica o restringe lo que otros pueden ver.","Retroalimentación":"El docente retroalimenta en fase 3 comparando versiones contra criterios de variación y precisión.","Evidencia individual esperada":"Oración reescrita con dos recursos distintos; se observa variación estructural y vocabulario preciso. [D1]","Conocimiento esencial":"Variación de estructuras oracionales y vocabulario para expresar perspectivas sobre poder."},"note":"","date":""},{"id":23,"week":6,"day":"Jueves","minutes":40,"header":"Sesión 23 · Semana 6 · Jueves · 40 min (1 módulo) [D2] (EE1, EE2, EE3, EE4, EE6) {FC06} · Ajustar registro y estilo según quién tiene poder para hablar y para quién se habla. · práctica guiada","objective":"Ajustar registro y estilo según quién tiene poder para hablar y para quién se habla.","mode":"práctica guiada","codes":"D2","activities":[{"id":"S23-A1","phase":"Conectar y cuestionar","minutes":5,"text":"Observan dos versiones del mismo mensaje sobre desigualdad: una formal institucional, una informal. ¿Qué cambia y por qué quien lo escribe elige ese registro? [D2 · activar conocimiento previo]","details":[],"status":"Pendiente","note":"","resourceLink":""},{"id":"S23-A2","phase":"Equipar al estudiante","minutes":7,"text":"Docente modela cómo identificar tres marcas de registro: léxico, distancia y tono; muestra un texto breve y señala cada marca. Criterios: identifica léxico adecuado, mantiene tono consistente, ajusta distancia al lector. [D2 · modelado explícito]","details":[],"status":"
