<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redland School · Planificador de unidad</title><style>
:root{--navy:#111111;--red:#b8112b;--bg:#f4f5f7;--line:#dce1e8;--ink:#182737}*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,select,input,textarea{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);border-radius:7px;background:white;padding:8px 13px;color:var(--navy)}button:hover{background:#f7ecee}button.primary{background:var(--navy);color:white}button:disabled{opacity:.35;cursor:default}header{background:white;border-top:5px solid var(--red);padding:20px 4vw;border-bottom:1px solid var(--line)}header .brand{font-size:12px;letter-spacing:.16em;color:var(--red);font-weight:800}h1{font-size:28px;line-height:1.2;margin:5px 0}h2{font-size:23px;line-height:1.3}h3{font-size:18px}.sub,.muted{color:#5a697a;font-size:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 4vw;background:white;position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line)}nav button.active{border-color:var(--red);color:var(--red);font-weight:700}main{max-width:1160px;margin:25px auto;padding:0 25px 60px}.panel{background:white;padding:25px 30px;border:1px solid var(--line);border-radius:10px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.session{background:white;border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:10px}.session p{margin:0}.session button{align-self:start;margin-top:auto}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--red)}.activity{background:white;border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:8px;margin:16px 0;padding:23px}.activity.done{border-left-color:#35825c}.acthead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.acthead h3{margin:0;flex:1}.chip{font-size:12px;color:#526277;background:#eef1f5;padding:4px 7px;border-radius:4px}.editable{white-space:pre-wrap;padding:5px;border:1px solid transparent;border-radius:4px;overflow-wrap:anywhere}.editable[contenteditable=true]:hover,.editable[contenteditable=true]:focus{border-color:#a4b4c8;background:#fbfcff;outline:none}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;margin-top:15px}.controls label{font-size:13px}.controls select{max-width:210px}.status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:0;margin:0 10px 0 0;padding:0}.status legend{float:left;font-size:13px;margin-right:4px;padding:0}.chk{display:inline-flex;align-items:center;gap:5px;cursor:pointer}.chk input{width:18px;height:18px;margin:0;accent-color:var(--red);cursor:pointer}.classmode .chk{font-size:17px}.classmode .chk input{width:24px;height:24px}.time{width:70px;border:1px solid var(--line);padding:4px;border-radius:4px}details{margin:12px 0}summary{cursor:pointer;color:var(--navy);font-weight:650}.detail{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}.note{width:100%;min-height:70px;border:1px solid var(--line);border-radius:6px;padding:10px;background:#fffef9}.linkfield{width:100%;border:1px solid var(--line);padding:8px;border-radius:5px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}.notice{font-size:14px;color:#4e6072;border-left:3px solid var(--red);padding-left:12px}.statusmsg{font-size:12px;color:#5a697a}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:12px;text-align:left;vertical-align:top}th{background:#edf1f7}a{color:var(--navy)}.classmode .editonly{display:none!important}.classmode .editable{border:0}.classmode .activity{font-size:20px;padding:30px}.classmode .acthead h3{font-size:24px}.classmode main{max-width:1100px}.classmode .detail{font-size:17px}footer{font-size:12px;color:#637183;padding:20px 4vw;border-top:1px solid var(--line)}#toast{position:fixed;bottom:20px;right:20px;max-width:500px;background:var(--navy);color:white;padding:14px;border-radius:8px;z-index:10;display:none}.checklist{display:grid;gap:8px}input[type=search]{padding:10px 14px;border:1px solid var(--line);border-radius:7px;min-width:280px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.panel{padding:18px}main{padding:0 14px}}@media(max-width:540px){.grid{grid-template-columns:1fr}h1{font-size:24px}}@media print{nav,header .toolbar,.controls,.editonly,footer,#toast{display:none!important}body{background:white}main{margin:0;max-width:none}.activity,.panel{break-inside:avoid;border:1px solid #ccc}.editable{padding:0}.note{background:white}details{display:block}header{padding:5px 0}.classmode .activity{font-size:14px}a{color:black}}
</style></head><body><header><div class="brand">REDLAND SCHOOL · MYP</div><h1 id="utitle"></h1><div class="sub" id="usub"></div><div class="toolbar"><button class="primary" id="savecopy">Guardar copia con cambios</button><button id="export">Exportar respaldo</button><button id="import">Importar respaldo</button><button id="print">Imprimir vista</button><span class="statusmsg" id="saved"></span></div></header><nav id="nav"><button data-view="map">Mapa de la unidad</button><button data-view="lesson">Preparar sesión</button><button data-view="class">Usar en clase</button><button data-view="resources">Recursos</button><button data-view="reference">Marco curricular</button><button data-view="help">Cómo usar</button></nav><main id="main"></main><footer>Archivo de trabajo local · Los cambios no se sincronizan con otras personas. Guarde una copia para conservarlos y compartirlos.</footer><div id="toast" role="status"></div><input type="file" id="file" accept="application/json,.json" hidden><script id="seed" type="application/json">__UNIT_DATA__</script><script>
'use strict';
const initial=JSON.parse(document.getElementById('seed').textContent);let state=structuredClone(initial),view='map',selected=initial.sessions[0].id,search='';const slug=String(initial.title||'unidad').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'')||'unidad';const KEY='redland-unit-v1-'+slug;const NS=initial.sessions.length,FIRST=initial.sessions[0].id,LAST=initial.sessions[NS-1].id;const isSum=s=>s.summative===true||(s.summative!==false&&/evaluaci[oó]n sumativa/i.test(s.objective+' '+s.mode));const listY=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' y '+a[a.length-1];const weeks=()=>Math.max(...state.sessions.map(s=>+s.week||0));const C=k=>(state.curriculum||{})[k]||'';let storageOK=true,saveTimer;
try{let old=localStorage.getItem(KEY);if(old){let v=JSON.parse(old);if(valid(v)&&(!initial.savedAt||(v.savedAt||0)>initial.savedAt))state=v}}catch(e){storageOK=false}
function valid(v){return v&&v.version===1&&Array.isArray(v.sessions)&&v.sessions.length===NS&&v.sessions.every(s=>Number.isInteger(s.id)&&Array.isArray(s.activities)&&s.activities.every(a=>typeof a.id==='string'&&typeof a.text==='string'&&Number.isFinite(a.minutes)&&Array.isArray(a.details)))}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',4000)}
function persist(){state.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false}document.getElementById('saved').textContent=storageOK?'Cambios guardados en este navegador':'Guarde una copia para conservar los cambios';}
function download(name,body,type){let u=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function session(){return state.sessions.find(s=>s.id===selected)}function act(id){for(let s of state.sessions){let a=s.activities.find(a=>a.id===id);if(a)return [s,a]}return []}
function ed(text,path,tag='div'){return `<${tag} class="editable" ${view==='class'?'':'contenteditable="true" spellcheck="true"'} data-path="${esc(path)}">${esc(text)}</${tag}>`}
function get(path){return path.split('.').reduce((a,k)=>a[k],state)}function put(path,val){let p=path.split('.'),k=p.pop(),o=p.reduce((a,k)=>a[k],state);o[k]=val;persist()}
function sidx(){return state.sessions.findIndex(s=>s.id===selected)}
function details(a,si,ai){return a.details.length?`<details><summary>Recursos y orientaciones de esta actividad (${a.details.length})</summary>${a.details.map((d,i)=>`<div class="detail">${ed(d,`sessions.${si}.activities.${ai}.details.${i}`)}</div>`).join('')}</details>`:''}
function render(){document.body.classList.toggle('classmode',view==='class');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let m=document.getElementById('main');
if(view==='map'){
let count=state.sessions.reduce((n,s)=>n+s.activities.filter(a=>a.status==='Realizada').length,0),total=state.sessions.reduce((n,s)=>n+s.activities.length,0);
m.innerHTML=`<section class="panel"><span class="eyebrow">LA UNIDAD EN UNA MIRADA</span><h2>${esc(state.headline||state.title)}</h2>${ed(state.curriculum['Enunciado de la indagación'],'curriculum.Enunciado de la indagación')}<p>${[C('Concepto clave')&&'<strong>'+esc(C('Concepto clave'))+'</strong>',esc(listY(C('Conceptos relacionados').split(/\s*,\s*/).filter(Boolean))),esc(C('Contexto global')),esc(C('Exploración'))].filter(Boolean).join(' · ')}</p><details><summary>Preguntas de indagación y desafío final</summary><h3>Preguntas</h3><div class="editable">${esc(state.curriculum['Preguntas de indagación'])}</div><h3>Evaluación sumativa</h3><div class="editable">${esc(state.curriculum['Evaluación sumativa'])}</div></details><p>${count} de ${total} actividades realizadas · ${state.sessions.reduce((n,s)=>n+s.activities.reduce((x,a)=>x+a.minutes,0),0)} minutos planificados</p><p class="notice">${(()=>{let ids=state.sessions.filter(isSum).map(s=>s.id);return ids.length?(ids.length>1?`Las sesiones ${listY(ids)} están reservadas`:`La sesión ${ids[0]} está reservada`)+' para la evaluación sumativa. ':''})()}Los identificadores de actividad conservan la sesión de origen si se trasladan.</p></section><div class="row between"><h2>Recorrido de las clases</h2><input id="search" type="search" placeholder="Buscar sesión, criterio o actividad" aria-label="Buscar sesiones" value="${esc(search)}"></div><div class="grid" id="cards"></div>`;cards();
}else if(view==='lesson'||view==='class'){
const s=session(),si=sidx(),sum=s.activities.reduce((n,a)=>n+a.minutes,0);m.innerHTML=`<div class="row between"><div class="row"><button id="prev" ${selected===FIRST?'disabled':''}>←</button><select id="selectsession" aria-label="Elegir sesión">${state.sessions.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>Sesión ${x.id} · Semana ${x.week}</option>`).join('')}</select><button id="next" ${selected===LAST?'disabled':''}>→</button></div><span class="chip">${sum} min actuales / ${s.minutes} min originales</span></div><section class="panel"><span class="eyebrow">SESIÓN ${s.id} · SEMANA ${s.week} · ${esc(s.day)}</span><h2>Aprendizaje de la clase</h2>${ed(s.objective,`sessions.${si}.objective`)}<p class="muted">Aspectos ${esc(s.codes)} · ${esc(s.mode)}</p><label class="editonly">Fecha de implementación <input type="date" data-path="sessions.${si}.date" value="${esc(s.date)}"></label><details class="editonly"><summary>Antes de la clase y qué observar</summary><h3>Materiales sugeridos</h3>${ed(s.extras['Materiales sugeridos']||'',`sessions.${si}.extras.Materiales sugeridos`)}<p class="notice">Son indicaciones de preparación. Un recurso solo está disponible al incorporarlo o enlazarlo en la actividad.</p><h3>Evidencia individual esperada</h3>${ed(s.extras['Evidencia individual esperada']||'Aplicación de la evaluación sumativa descrita en el marco curricular.',`sessions.${si}.extras.Evidencia individual esperada`)}<h3>Apoyos de acceso y extensión</h3><div class="editable">${esc((state.supports||{})['Diferenciación (estrategias para bajar barreras)']||'')}</div></details></section>${s.activities.map((a,ai)=>`<article class="activity ${a.status==='Realizada'?'done':''}"><div class="acthead"><span class="chip">${esc(a.id)}</span><h3>${esc(a.phase)}</h3><span>${a.minutes} min</span></div>${ed(a.text,`sessions.${si}.activities.${ai}.text`)}${details(a,si,ai)}${a.resourceLink?`<p><a href="${esc(safeURL(a.resourceLink))}" target="_blank" rel="noopener">Abrir recurso de la actividad ↗</a></p>`:''}<div class="controls"><fieldset class="status"><legend>Estado</legend>${['Pendiente','Realizada','Por retomar'].map(x=>`<label class="chk"><input type="checkbox" data-status="${a.id}" value="${x}" ${x===a.status?'checked':''}> ${x}</label>`).join('')}</fieldset><label class="editonly">Tiempo <input type="number" class="time" min="1" max="240" data-minutes="${a.id}" value="${a.minutes}"></label><button class="editonly" data-up="${a.id}" ${ai===0?'disabled':''} aria-label="Subir actividad">↑</button><button class="editonly" data-down="${a.id}" ${ai===s.activities.length-1?'disabled':''} aria-label="Bajar actividad">↓</button><select class="editonly" data-move="${a.id}" aria-label="Trasladar actividad"><option value="">Mover a otra sesión…</option>${state.sessions.filter(x=>x.id!==selected).map(x=>`<option value="${x.id}">Sesión ${x.id}</option>`).join('')}</select></div><details class="editonly"><summary>Mis ajustes y enlace al recurso</summary><label>Enlace al recurso<input class="linkfield" data-link="${a.id}" value="${esc(a.resourceLink)}" placeholder="https://…"></label><label>Notas o adaptación<textarea class="note" data-path="sessions.${si}.activities.${ai}.note">${esc(a.note)}</textarea></label></details></article>`).join('')}<section class="panel editonly"><h2>Después de implementar</h2><label>Hasta dónde llegamos, evidencia observada y decisiones para la próxima clase<textarea class="note" data-path="sessions.${si}.note">${esc(s.note)}</textarea></label><details><summary>Conexión conceptual y retroalimentación</summary>${Object.entries(s.extras).filter(([k])=>k!=='Materiales sugeridos'&&k!=='Evidencia individual esperada').map(([k,v])=>`<h3>${esc(k)}</h3>${ed(v,`sessions.${si}.extras.${k}`)}`).join('')}<h3>Referencia original</h3><p>${esc(s.header)}</p></details></section>`;
}else if(view==='resources'){m.innerHTML=`<section class="panel"><h2>Preparación de recursos</h2><p>Consulte los materiales sugeridos de cada sesión. Los modelos, consignas y respuestas ya incluidos permanecen junto a su actividad. Añada el enlace al material preparado en cada actividad.</p></section>${state.sessions.map(s=>`<section class="panel"><div class="row between"><h3>Sesión ${s.id}</h3><button data-open="${s.id}">Preparar sesión</button></div><p>${esc(s.extras['Materiales sugeridos']||'')}</p>${s.activities.filter(a=>a.resourceLink).map(a=>`<p>${esc(a.id)} · <a href="${esc(safeURL(a.resourceLink))}" target="_blank" rel="noopener">Abrir recurso</a></p>`).join('')}</section>`).join('')}`;
}else if(view==='reference'){m.innerHTML=`<section class="panel"><h2>Marco curricular y seguimiento</h2><p>Referencia completa del documento original. La matriz original no se recalcula cuando se mueven o modifican actividades. Revise las correspondencias antes de cerrar la unidad.</p>${state.referenceNotice?`<p class="notice">${esc(state.referenceNotice)}</p>`:''}</section>${(state.annex||[]).map(ar=>`<section class="panel"><details><summary>${esc(ar.title)}</summary>${ar.rows.map(row=>row.length===1?`<h3>${esc(row[0])}</h3>`:`<div class="detail"><strong>${esc(row[0])}</strong>${row.slice(1).map(v=>`<div class="editable">${esc(v)}</div>`).join('')}</div>`).join('')}</details></section>`).join('')}`;
}else{m.innerHTML=`<section class="panel"><span class="eyebrow">GUÍA DE USO</span><h2>Un archivo para preparar y acompañar las clases</h2><ol><li><strong>Descargue este HTML y ábralo en Chrome, Edge o Firefox.</strong> Funciona sin conexión.</li><li>En <strong>Mapa de la unidad</strong>, elija una de las ${NS} sesiones o busque una actividad.</li><li>En <strong>Preparar sesión</strong>, pulse sobre el texto para editarlo. Abra las orientaciones, agregue enlaces y ajuste tiempos.</li><li>Suba o baje una actividad con las flechas, o muévala a otra sesión con el selector. Se conserva el identificador de origen y se actualiza la suma de minutos.</li><li>En <strong>Usar en clase</strong>, consulte la secuencia con letra mayor y marque lo realizado o lo que debe retomar. Esta vista está pensada para el docente; las orientaciones pueden incluir respuestas.</li><li>Al terminar, vuelva a <strong>Preparar sesión</strong> y registre avances y decisiones.</li><li>Pulse <strong>Guardar copia con cambios</strong> para descargar un nuevo HTML que contiene el trabajo actualizado. Ese archivo puede abrirse en otro equipo.</li><li><strong>Exportar respaldo</strong> guarda los datos en JSON. <strong>Importar respaldo</strong> reemplaza los datos abiertos; guarde antes su versión si quiere conservarla.</li></ol><p>El guardado automático depende de este navegador. Para conservar o compartir su trabajo, descargue una copia con cambios. Las copias son independientes y no se sincronizan.</p><h3>Qué contiene</h3><p>Las ${NS} sesiones originales, ${state.sessions.reduce((n,s)=>n+s.activities.length,0)} actividades independientes y el marco curricular completo.${(()=>{let ids=state.sessions.filter(isSum).map(s=>s.id);return ids.length?` ${ids.length>1?'Las sesiones '+listY(ids)+' mantienen':'La sesión '+ids[0]+' mantiene'} su bloque de evaluación sumativa.`:''})()} Los materiales sugeridos siguen requiriendo preparación cuando el original no los incorpora.</p><h3>Imprimir</h3><p>Seleccione una sesión y pulse Imprimir vista. Despliegue antes las orientaciones que desee incluir.</p></section>`}
}
function safeURL(v){try{let u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch(e){return '#'}}
function cards(){let q=search.toLocaleLowerCase('es');document.getElementById('cards').innerHTML=state.sessions.filter(s=>JSON.stringify(s).toLocaleLowerCase('es').includes(q)).map(s=>`<article class="session"><span class="eyebrow">SESIÓN ${s.id} · SEMANA ${s.week}</span><p><strong>${esc(s.objective)}</strong></p><p class="muted">${s.minutes} min originales · ${esc(s.codes)}</p><p class="muted">${s.activities.filter(a=>a.status==='Realizada').length}/${s.activities.length} realizadas</p>${s.note?`<p class="notice">${esc(s.note)}</p>`:''}<button data-open="${s.id}">Abrir sesión →</button></article>`).join('')||'<p>No se encontraron sesiones.</p>'}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();window.scrollTo(0,0)}if(b.dataset.open){selected=+b.dataset.open;view='lesson';render();window.scrollTo(0,0)}if(b.id==='prev'||b.id==='next'){let i=sidx()+(b.id==='prev'?-1:1);if(i>=0&&i<NS)selected=state.sessions[i].id;render();window.scrollTo(0,0)}if(b.dataset.up||b.dataset.down){let [s,a]=act(b.dataset.up||b.dataset.down),i=s.activities.indexOf(a),j=i+(b.dataset.up?-1:1);if(j>=0&&j<s.activities.length){[s.activities[i],s.activities[j]]=[s.activities[j],s.activities[i]];persist();render()}}});
document.addEventListener('input',e=>{let x=e.target;if(x.id==='search'){search=x.value;cards();return}if(x.dataset.path){put(x.dataset.path,x.isContentEditable?x.innerText:x.value)}});
document.addEventListener('change',e=>{let x=e.target;if(x.id==='selectsession'){selected=+x.value;render()}if(x.dataset.status){act(x.dataset.status)[1].status=x.checked?x.value:'Pendiente';persist();render()}if(x.dataset.minutes){let v=Number(x.value);if(Number.isFinite(v)&&v>=1&&v<=240){act(x.dataset.minutes)[1].minutes=v;persist()}render()}if(x.dataset.link){if(x.value&&!safeURL(x.value).startsWith('http')){toast('Use un enlace completo que comience por https://');return}act(x.dataset.link)[1].resourceLink=x.value;persist();render()}if(x.dataset.move&&x.value){let [s,a]=act(x.dataset.move),target=state.sessions.find(s=>s.id===+x.value);s.activities.splice(s.activities.indexOf(a),1);target.activities.push(a);persist();render();toast(a.id+' trasladada a la sesión '+target.id)}});
document.getElementById('export').onclick=()=>{persist();download('Respaldo_'+slug+'.json',JSON.stringify(state,null,2),'application/json')};
document.getElementById('savecopy').onclick=()=>{persist();let old=document.getElementById('seed').textContent;document.getElementById('seed').textContent=JSON.stringify(state).replace(/</g,'\\u003c');let doc='<!DOCTYPE html>\n'+document.documentElement.outerHTML;document.getElementById('seed').textContent=old;download('Planificador_'+slug+'_actualizado.html',doc,'text/html;charset=utf-8');toast('Copia con los cambios descargada')};
document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!valid(v))throw Error();if(!confirm('Se reemplazarán los datos abiertos por este respaldo. ¿Continuar?'))return;state=v;persist();render();toast('Respaldo importado')}catch(er){toast('El archivo no es un respaldo válido de esta unidad')}e.target.value=''};
document.getElementById('print').onclick=()=>window.print();document.getElementById('utitle').textContent=state.title;document.getElementById('usub').textContent=state.subtitle||[state.meta&&state.meta['Grupo de asignaturas'],state.meta&&state.meta['Año del PAI'],NS+' sesiones',weeks()+' semana'+(weeks()===1?'':'s')].filter(Boolean).join(' · ');document.title='Redland School · '+state.title;render();document.getElementById('saved').textContent=storageOK?'Guardado local disponible · descargue una copia para compartir':'Guarde una copia para conservar cambios';
</script></body></html>
